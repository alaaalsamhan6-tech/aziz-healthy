<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>عزيز هيلثي — الإعلانات</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --g1:#5F6F52;--g2:#8A9A72;--g3:#C5C0A5;--g4:#E8E2D2;
  --white:#FFFFFF;--surface:#F5F3EE;--border:#D6D0C0;--ink:#2C2C2C;--ink2:#5F6F52;--ink3:#9A9A80;
  --red:#C0392B;--red2:#FADBD8;--blue:#1F618D;--blue2:#D6EAF8;--gold:#856404;--gold2:#FFF3CD;
}
body{font-family:'Cairo',sans-serif;background:var(--surface);color:var(--ink);min-height:100vh}
.nav{background:var(--g1);height:56px;display:flex;align-items:center;padding:0 2rem;gap:2rem;position:sticky;top:0;z-index:100;border-bottom:3px solid var(--g3)}
.nav-brand{color:#fff;font-size:17px;font-weight:700}
.nav-tabs{display:flex;gap:2px;margin-right:auto;flex-wrap:wrap}
.ntab{background:none;border:none;color:rgba(255,255,255,.6);padding:6px 14px;border-radius:6px;cursor:pointer;font-family:'Cairo',sans-serif;font-size:12px;font-weight:600;transition:.15s}
.ntab:hover{color:#fff;background:rgba(255,255,255,.1)}
.ntab.active{color:#fff;background:rgba(255,255,255,.2);border-bottom:2px solid var(--g4)}
.sync-bar{display:flex;align-items:center;gap:8px;font-size:11px;color:rgba(255,255,255,.6)}
.sync-dot{width:7px;height:7px;border-radius:50%;background:#4CAF50;flex-shrink:0}
.sync-dot.loading{background:#FFC107;animation:pulse 1s infinite}
.sync-dot.error{background:var(--red)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.page{display:none;padding:2rem;max-width:1400px;margin:0 auto}.page.active{display:block}
/* KPI */
.kpi-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin-bottom:2rem}
.kpi{background:#fff;border-radius:12px;padding:1.1rem 1.25rem;border:1px solid var(--border);position:relative;overflow:hidden}
.kpi-label{font-size:11px;font-weight:600;color:var(--ink3);text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px}
.kpi-val{font-size:26px;font-weight:700;line-height:1;color:var(--ink)}
.kpi-sub{font-size:11px;color:var(--ink3);margin-top:6px}
.kpi-accent{position:absolute;top:0;right:0;width:4px;height:100%}
/* CARD */
.card{background:#fff;border-radius:12px;border:1px solid var(--border);overflow:hidden;margin-bottom:1.5rem;padding:1.25rem}
.sh{display:flex;align-items:center;justify-content:space-between;margin-bottom:1.25rem;flex-wrap:wrap;gap:10px}
.sh h2{font-size:15px;font-weight:700;color:var(--ink);margin:0;display:flex;align-items:center;gap:8px}
.cnt{font-size:11px;color:var(--ink3);background:var(--surface);padding:2px 8px;border-radius:20px;border:1px solid var(--border)}
/* TABLE */
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{background:var(--surface);padding:10px 14px;text-align:right;font-weight:600;color:var(--ink3);border-bottom:1px solid var(--border);white-space:nowrap;font-size:11px;text-transform:uppercase;letter-spacing:.3px}
.tbl td{padding:10px 14px;border-bottom:1px solid var(--border);color:var(--ink);vertical-align:middle}
.tbl tr:last-child td{border-bottom:none}
.tbl tr:hover td{background:var(--surface)}
/* CLIENT CARDS */
.clients-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
.client-card{background:#fff;border-radius:14px;border:1px solid var(--border);overflow:hidden;transition:.2s}
.client-card:hover{box-shadow:0 4px 20px rgba(95,111,82,.12)}
.client-card.has-active{border-top:3px solid var(--g2)}
.client-card.is-repeat:not(.has-active){border-top:3px solid var(--g3)}
.cc-head{padding:14px 16px 8px}
.cc-name{font-size:14px;font-weight:700;color:var(--ink)}
.cc-meta{font-size:11px;color:var(--ink3);margin-top:3px}
.cc-badges{margin-top:8px;display:flex;gap:4px;flex-wrap:wrap}
.cc-stats{display:grid;grid-template-columns:1fr 1fr 1fr;border-top:1px solid var(--border);border-bottom:1px solid var(--border)}
.cc-stat{padding:10px 12px;text-align:center}
.cc-stat:not(:last-child){border-left:1px solid var(--border)}
.cc-stat-val{font-size:16px;font-weight:700;color:var(--ink);line-height:1}
.cc-stat-lbl{font-size:10px;color:var(--ink3);margin-top:3px}
.cc-ads{padding:10px 16px}
.cc-ad-row{display:flex;align-items:center;gap:8px;padding:7px 10px;background:var(--surface);border-radius:8px;margin-bottom:6px;border:1px solid var(--border)}
.ad-num{width:20px;height:20px;border-radius:50%;background:var(--g1);color:#fff;font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.ad-info{flex:1;min-width:0}
.ad-title{font-size:12px;font-weight:600;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ad-sub{font-size:10px;color:var(--ink3);margin-top:1px;display:flex;gap:5px;flex-wrap:wrap;align-items:center}
.ad-amount{font-size:12px;font-weight:700;color:var(--g1);white-space:nowrap}
/* BADGES */
.badge{display:inline-flex;align-items:center;padding:2px 8px;border-radius:20px;font-size:10px;font-weight:700;white-space:nowrap}
.b-green{background:#D5F5E3;color:#1A7A4A}
.b-olive{background:#E8EDE0;color:var(--g1)}
.b-blue{background:var(--blue2);color:var(--blue)}
.b-gold{background:var(--gold2);color:var(--gold)}
.b-red{background:var(--red2);color:var(--red)}
.b-gray{background:#F0F0F0;color:#666}
.b-sand{background:var(--g4);color:var(--g1)}
.ptag{display:inline-flex;align-items:center;padding:1px 7px;border-radius:5px;font-size:9px;font-weight:700}
.p-tiktok{background:#1A1A1A;color:#fff}
.p-snap{background:#FFFC00;color:#1A1A1A}
.p-insta{background:linear-gradient(45deg,#f09433,#dc2743,#bc1888);color:#fff}
.p-all{background:var(--g2);color:#fff}
.p-x{background:#000;color:#fff}
.p-yt{background:#FF0000;color:#fff}
/* FILTERS */
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:1.25rem;align-items:center}
.fb{background:#fff;border:1px solid var(--border);border-radius:20px;padding:5px 14px;font-family:'Cairo',sans-serif;font-size:12px;font-weight:500;cursor:pointer;color:var(--ink2);transition:.15s}
.fb.active{background:var(--g1);color:#fff;border-color:var(--g1)}
.fb:hover:not(.active){background:var(--surface)}
.fsel{border:1px solid var(--border);border-radius:20px;padding:5px 14px;font-family:'Cairo',sans-serif;font-size:12px;color:var(--ink);background:#fff;cursor:pointer;outline:none}
.fsel:focus{border-color:var(--g1)}
/* BUTTONS */
.btn-primary{background:var(--g1);color:#fff;border:none;border-radius:8px;padding:7px 16px;font-family:'Cairo',sans-serif;font-size:12px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;gap:5px}
.btn-primary:hover{background:var(--ink2)}
/* CHARTS */
.bar-chart{display:flex;align-items:flex-end;gap:5px;height:120px;overflow-x:auto;padding-bottom:2px;direction:ltr}
.bar-col{display:flex;flex-direction:column;align-items:center;gap:3px;flex:1;min-width:38px}
.bar-body{border-radius:5px 5px 0 0;width:100%;background:var(--g2);min-height:3px;transition:.3s}
.bar-lbl{font-size:9px;color:var(--ink3);font-weight:600;text-transform:uppercase}
.bar-v{font-size:9px;font-weight:700;color:var(--g1)}
/* PROGRESS */
.progress-bar{background:var(--g4);border-radius:99px;height:5px;overflow:hidden;margin-top:4px}
.progress-fill{height:100%;border-radius:99px;background:var(--g2)}
/* LEGEND */
.legend-row{display:flex;align-items:center;gap:8px;padding:6px 0;font-size:12px;border-bottom:1px solid var(--border)}
.legend-row:last-child{border:none}
/* PIPELINE */
.pipeline{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}
@media(max-width:1100px){.pipeline{grid-template-columns:repeat(2,1fr)}}
@media(max-width:600px){.pipeline{grid-template-columns:1fr}}
.pl-col{background:#fff;border-radius:12px;border:1px solid var(--border);min-height:180px}
.pl-head{padding:12px 14px;border-bottom-width:2px;border-bottom-style:solid;font-size:12px;font-weight:700;display:flex;justify-content:space-between;align-items:center}
.pl-body{padding:10px;display:flex;flex-direction:column;gap:8px}
.pl-card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:10px}
.pl-dates{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:8px}
.pl-date-box{background:#fff;border:1px solid var(--border);border-radius:8px;padding:6px 8px;text-align:center}
.pl-date-lbl{font-size:9px;font-weight:700;text-transform:uppercase}
.pl-date-val{font-size:11px;font-weight:700;color:var(--ink);margin-top:2px}
/* GRID */
.g2{display:grid;grid-template-columns:1fr 1fr;gap:1.5rem}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:1.5rem}
@media(max-width:800px){.g2,.g3{grid-template-columns:1fr}}
/* FIN */
.fin-row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--border)}
.fin-row:last-child{border:none}
/* WEEKLY */
.week-section{background:#fff;border-radius:12px;border:1px solid var(--border);overflow:hidden;margin-bottom:1.5rem}
.week-section-head{padding:12px 16px;display:flex;justify-content:space-between;align-items:center}
.week-section-head h3{color:#fff;font-size:13px;font-weight:700;margin:0}
/* LOADING SKELETON */
.skeleton{background:linear-gradient(90deg,var(--surface) 25%,var(--g4) 50%,var(--surface) 75%);background-size:200% 100%;animation:shimmer 1.5s infinite;border-radius:8px;height:20px;margin-bottom:8px}
@keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}
/* TOAST */
.toast{position:fixed;bottom:1.5rem;right:1.5rem;background:var(--g1);color:#fff;padding:10px 20px;border-radius:10px;font-size:13px;font-weight:700;z-index:999;opacity:0;transform:translateY(8px);transition:.3s;pointer-events:none}
.toast.show{opacity:1;transform:translateY(0)}
input[type="date"]{direction:ltr;text-align:left}
.empty-state{text-align:center;padding:3rem 0;color:var(--ink3)}
.empty-state .icon{font-size:48px;margin-bottom:12px}
.empty-state p{font-size:13px}
/* REFRESH BTN */
.refresh-btn{background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.3);color:#fff;border-radius:6px;padding:4px 10px;font-family:'Cairo',sans-serif;font-size:11px;cursor:pointer}
.refresh-btn:hover{background:rgba(255,255,255,.25)}
</style>
</head>
<body>

<nav class="nav">
  <div class="nav-brand">عزيز هيلثي</div>
  <div class="nav-tabs">
    <button class="ntab active" onclick="showPage('overview',this)">نظرة عامة</button>
    <button class="ntab" onclick="showPage('upcoming',this)">الإعلانات القادمة</button>
    <button class="ntab" onclick="showPage('clients',this)">العملاء والإعلانات</button>
    <button class="ntab" onclick="showPage('finance',this)">المالية</button>
    <button class="ntab" onclick="showPage('weekly',this)">خطة الأسبوع</button>
  </div>
  <div class="sync-bar">
    <div class="sync-dot loading" id="sync-dot"></div>
    <span id="sync-text">جاري التحميل...</span>
    <button class="refresh-btn" onclick="loadAll()">↻ تحديث</button>
  </div>
</nav>

<!-- OVERVIEW -->
<div class="page active" id="page-overview">
  <div class="kpi-row" id="ov-kpis">
    <div class="kpi"><div class="skeleton"></div><div class="skeleton" style="width:60%"></div></div>
    <div class="kpi"><div class="skeleton"></div><div class="skeleton" style="width:60%"></div></div>
    <div class="kpi"><div class="skeleton"></div><div class="skeleton" style="width:60%"></div></div>
    <div class="kpi"><div class="skeleton"></div><div class="skeleton" style="width:60%"></div></div>
  </div>
  <div class="card">
    <div class="sh">
      <h2>الدخل الشهري</h2>
      <select class="fsel" id="ov-year" onchange="renderOverview()">
        <option value="all">كل السنوات</option>
      </select>
    </div>
    <div class="bar-chart" id="ov-chart"><div class="skeleton" style="height:80px;width:100%"></div></div>
  </div>
  <div class="g3">
    <div class="card"><div class="sh"><h2>أنواع الإعلانات</h2></div><div id="ov-types"></div></div>
    <div class="card"><div class="sh"><h2>عقود قيد العمل</h2></div><div id="ov-active"></div></div>
    <div class="card"><div class="sh"><h2>العملاء الدائمون</h2></div><div id="ov-repeats"></div></div>
  </div>
  <div class="card"><div class="sh"><h2>العملاء الأعلى دخلاً</h2></div><div id="ov-top"></div></div>
</div>

<!-- UPCOMING -->
<div class="page" id="page-upcoming">
  <div class="sh">
    <h2>الإعلانات القادمة <span class="cnt" id="up-cnt">—</span></h2>
  </div>
  <div class="pipeline" id="pipeline"></div>
</div>

<!-- CLIENTS -->
<div class="page" id="page-clients">
  <div class="sh">
    <h2>العملاء والإعلانات <span class="cnt" id="cl-cnt">—</span></h2>
  </div>
  <div class="filters">
    <button class="fb active" onclick="filterClients('all',this)">الكل</button>
    <button class="fb" onclick="filterClients('active',this)">قيد العمل</button>
    <button class="fb" onclick="filterClients('repeat',this)">متكرر</button>
    <button class="fb" onclick="filterClients('contract',this)">عقد</button>
    <div style="margin-right:auto;display:flex;gap:8px;align-items:center">
      <span style="font-size:12px;color:var(--ink3)">ترتيب:</span>
      <select class="fsel" id="cl-sort" onchange="renderClients()">
        <option value="amount">الأعلى مبلغاً</option>
        <option value="latest">الأحدث</option>
        <option value="repeat">الأكثر تكراراً</option>
        <option value="status-active">نشط</option>
        <option value="status-ended">منتهي</option>
      </select>
    </div>
  </div>
  <div class="clients-grid" id="clients-grid"></div>
</div>

<!-- FINANCE -->
<div class="page" id="page-finance">
  <div class="sh"><h2>المالية</h2></div>
  <div class="kpi-row" id="fin-kpis"></div>
  <div class="card">
    <div class="sh">
      <h2>الدخل الشهري</h2>
      <select class="fsel" id="fin-year" onchange="renderFinance()">
        <option value="all">كل السنوات</option>
      </select>
    </div>
    <div class="bar-chart" id="fin-chart"></div>
  </div>
  <div class="card" style="padding:0;overflow:hidden">
    <div style="padding:12px 16px;background:var(--red);display:flex;justify-content:space-between;align-items:center">
      <h3 style="color:#fff;font-size:13px;font-weight:700;margin:0">المصروفات</h3>
    </div>
    <div style="overflow-x:auto">
      <table class="tbl">
        <thead><tr><th>التاريخ</th><th>البند</th><th>المبلغ</th><th>الفئة</th><th>ملاحظات</th></tr></thead>
        <tbody id="exp-tbody"></tbody>
      </table>
    </div>
  </div>
</div>

<!-- WEEKLY -->
<div class="page" id="page-weekly">
  <div class="sh">
    <div>
      <h2>خطة الأسبوع</h2>
      <div style="font-size:12px;color:var(--ink3);margin-top:4px" id="week-info-label"></div>
    </div>
    <div style="display:flex;gap:8px;align-items:center">
      <select class="fsel" id="week-selector" onchange="switchWeek(this.value)">
        <option value="">اختر أسبوعاً...</option>
      </select>
    </div>
  </div>
  <div id="weekly-content">
    <div class="empty-state"><div class="icon">📅</div><p>جاري تحميل خطة الأسبوع من Google Sheets...</p></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ════════════════════════════════════════════
// CONFIG — Google Sheets
// ════════════════════════════════════════════
const SHEET_ID = '1BoqP-1ekwufxUd8QYXNtTO_DHsgPe0hu';
const BASE = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json`;

const SHEETS = {
  ads:      'الاعلانات',
  clients:  'العملاء',
  upcoming: 'الاعلانات القادمة',
  finance:  'المالية',
  weekly:   'خطة الاسبوع',
};

// ════════════════════════════════════════════
// STATE
// ════════════════════════════════════════════
let rawAds = [], rawClients = [], rawUpcoming = [], rawExpenses = [], rawWeekly = [];
let clientMap = {};
let clientFilter = 'all';
let currentWeekIdx = 0;

// ════════════════════════════════════════════
// UTILS
// ════════════════════════════════════════════
const ARM = ['يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];
const MEN = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

function fmtDate(s) {
  if (!s || s === '' || s === '—') return '—';
  // handle Date(y,m,d) format from gviz
  if (typeof s === 'string' && s.startsWith('Date(')) {
    const parts = s.slice(5,-1).split(',').map(Number);
    const d = new Date(parts[0], parts[1], parts[2]);
    return `${d.getDate()} ${ARM[d.getMonth()]} ${d.getFullYear()}`;
  }
  // handle dd/mm/yyyy or yyyy-mm-dd
  try {
    const d = new Date(s);
    if (!isNaN(d)) return `${d.getDate()} ${ARM[d.getMonth()]} ${d.getFullYear()}`;
  } catch(e) {}
  return s;
}

function fmtMoney(n) {
  if (!n && n !== 0) return '—';
  const num = parseFloat(n);
  if (isNaN(num) || num === 0) return '—';
  return num.toLocaleString('ar') + ' ر.س';
}

function monthKey(s) {
  if (!s) return '';
  if (typeof s === 'string' && s.startsWith('Date(')) {
    const parts = s.slice(5,-1).split(',').map(Number);
    return `${MEN[parts[1]]} ${parts[0]}`;
  }
  try {
    const d = new Date(s);
    if (!isNaN(d)) return `${MEN[d.getMonth()]} ${d.getFullYear()}`;
  } catch(e){}
  return '';
}

function showPage(id, btn) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.ntab').forEach(t => t.classList.remove('active'));
  document.getElementById('page-' + id).classList.add('active');
  btn.classList.add('active');
}

function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}

function setSyncing(loading, error) {
  const dot = document.getElementById('sync-dot');
  const txt = document.getElementById('sync-text');
  dot.className = 'sync-dot' + (loading ? ' loading' : error ? ' error' : '');
  txt.textContent = loading ? 'جاري التحميل...' : error ? 'خطأ في الاتصال' : `آخر تحديث: ${new Date().toLocaleTimeString('ar-SA')}`;
}

function ptag(p) {
  if (!p) return '';
  const map = {
    'تيك توك': 'p-tiktok', 'سناب': 'p-snap',
    'انستقرام': 'p-insta', 'جميع المنصات': 'p-all',
    'X': 'p-x', 'يوتيوب': 'p-yt',
  };
  return `<span class="ptag ${map[p] || 'p-all'}">${p}</span>`;
}

// ════════════════════════════════════════════
// GOOGLE SHEETS FETCH
// ════════════════════════════════════════════
async function fetchSheet(sheetName) {
  const url = `${BASE}&sheet=${encodeURIComponent(sheetName)}`;
  const res = await fetch(url);
  const text = await res.text();
  // gviz returns: /*O_o*/ google.visualization.Query.setResponse({...});
  const json = JSON.parse(text.match(/google\.visualization\.Query\.setResponse\(([\s\S]*)\)/)[1]);
  const cols = json.table.cols.map(c => c.label || c.id);
  const rows = (json.table.rows || []).map(r => {
    const obj = {};
    cols.forEach((col, i) => {
      const cell = r.c && r.c[i];
      obj[col] = cell ? (cell.f !== undefined && cell.f !== null ? cell.f : cell.v) : null;
    });
    return obj;
  });
  return { cols, rows };
}

// ════════════════════════════════════════════
// LOAD ALL DATA
// ════════════════════════════════════════════
async function loadAll() {
  setSyncing(true);
  try {
    const [adsData, clientsData, upData, finData, weekData] = await Promise.all([
      fetchSheet(SHEETS.ads),
      fetchSheet(SHEETS.clients),
      fetchSheet(SHEETS.upcoming),
      fetchSheet(SHEETS.finance),
      fetchSheet(SHEETS.weekly),
    ]);

    // Parse Ads — skip header/summary rows (ID must be a number)
    rawAds = adsData.rows.filter(r => {
      const id = r['ID'] || r[adsData.cols[0]];
      return id && !isNaN(parseFloat(id));
    }).map(r => ({
      id:       r['ID'] || r[adsData.cols[0]],
      brand:    r['اسم الشركة / البراند'] || r['اسم الشركة'] || r['الشركة'] || '',
      amount:   parseFloat(r['المبلغ (ريال)'] || r['المبلغ'] || r['القيمة'] || 0) || 0,
      pct:      parseFloat(r['النسبة %'] || r['النسبة'] || 0) || 0,
      type:     r['نوع الإعلان'] || r['النوع'] || 'مرة واحدة',
      status:   r['المرحلة'] || r['الحالة'] || '',
      platform: r['المنصة'] || '',
      city:     r['المدينة'] || '',
      adDate:   r['تاريخ الإعلان'] || '',
      pubDate:  r['تاريخ النشر'] || '',
      notes:    r['ملاحظات'] || '',
    })).filter(r => r.brand);

    // Parse Clients
    rawClients = clientsData.rows.filter(r => r[clientsData.cols[0]]).map(r => ({
      name:    r['اسم العميل / البراند'] || r['اسم العميل'] || r[clientsData.cols[0]] || '',
      status:  r['حالة العميل'] || r['الحالة'] || 'نشط',
      count:   r['إجمالي الإعلانات'] || 0,
      total:   r['إجمالي المبالغ (ر.س)'] || r['إجمالي المبالغ'] || 0,
      lastAd:  r['آخر إعلان'] || '',
      notes:   r['ملاحظات'] || '',
    })).filter(r => r.name);

    // Build client map from ads
    clientMap = {};
    rawAds.forEach(a => {
      const k = a.brand.trim();
      if (!clientMap[k]) {
        const cl = rawClients.find(c => c.name.trim() === k);
        clientMap[k] = { name: k, ads: [], clientStatus: cl ? cl.status : 'نشط' };
      }
      clientMap[k].ads.push(a);
    });

    // Parse Upcoming
    rawUpcoming = upData.rows.filter(r => r[upData.cols[0]]).map(r => ({
      name:     r['اسم العميل'] || r[upData.cols[0]] || '',
      platform: r['المنصة'] || '',
      city:     r['المدينة'] || '',
      adDate:   r['تاريخ الاتفاق'] || r['تاريخ الإعلان'] || '',
      pubDate:  r['تاريخ النشر المتوقع'] || r['تاريخ النشر'] || '',
      stage:    r['المرحلة'] || 'غير معتمد',
      assigned: r['المسؤول'] || '',
      notes:    r['ملاحظات'] || '',
    })).filter(r => r.name);

    // Parse Expenses (from المالية sheet, rows after the KPI section)
    rawExpenses = finData.rows.filter(r => {
      const v = r[finData.cols[0]] || r['التاريخ'] || r['البند'];
      const amt = r['المبلغ (ر.س)'] || r['المبلغ'];
      return amt && parseFloat(amt) > 0;
    }).map(r => ({
      date:   r['التاريخ'] || '',
      name:   r['البند'] || '',
      amount: parseFloat(r['المبلغ (ر.س)'] || r['المبلغ'] || 0) || 0,
      cat:    r['الفئة'] || '',
      notes:  r['ملاحظات'] || '',
    })).filter(r => r.name && r.amount > 0);

    // Parse Weekly
    rawWeekly = weekData.rows.filter(r => Object.values(r).some(v => v));

    // Build year options
    buildYearOptions();

    // Render all pages
    renderOverview();
    renderClients();
    renderPipeline();
    renderFinance();
    renderWeekly();

    setSyncing(false);
    toast('✅ تم تحميل البيانات من Google Sheets');

  } catch (e) {
    setSyncing(false, true);
    console.error(e);
    toast('❌ تعذر الاتصال — تأكد إن الملف مشارك للعموم');
  }
}

// ════════════════════════════════════════════
// YEAR OPTIONS
// ════════════════════════════════════════════
function buildYearOptions() {
  const years = [...new Set(rawAds.map(a => {
    const m = monthKey(a.adDate || a.pubDate);
    return m ? parseInt(m.split(' ')[1]) : null;
  }).filter(Boolean))].sort();
  const min = Math.min(2025, ...(years.length ? years : [2025]));
  const opts = ['<option value="all">كل السنوات</option>'];
  for (let y = min; y <= 2030; y++) opts.push(`<option value="${y}">${y}</option>`);
  ['ov-year', 'fin-year'].forEach(id => {
    const el = document.getElementById(id);
    if (el) el.innerHTML = opts.join('');
  });
}

// ════════════════════════════════════════════
// BAR CHART
// ════════════════════════════════════════════
function renderBarChart(elId, ads, yf) {
  const bm = {};
  ads.forEach(a => {
    const d = a.adDate || a.pubDate;
    if (!d) return;
    const m = monthKey(d);
    if (!m) return;
    const yr = parseInt(m.split(' ')[1]);
    if (yf !== 'all' && yr !== +yf) return;
    if (a.status === 'تمت') bm[m] = (bm[m] || 0) + a.amount;
  });
  const keys = Object.keys(bm);
  if (!keys.length) {
    document.getElementById(elId).innerHTML = '<div style="color:var(--ink3);font-size:12px;padding:20px 0">لا توجد بيانات</div>';
    return;
  }
  const dates = keys.map(k => { const [mo, yr] = k.split(' '); return new Date(yr, MEN.indexOf(mo), 1); }).sort((a, b) => a - b);
  const allMonths = [];
  let cur = new Date(dates[0]);
  const end = dates[dates.length - 1];
  while (cur <= end) { allMonths.push(`${MEN[cur.getMonth()]} ${cur.getFullYear()}`); cur.setMonth(cur.getMonth() + 1); }
  const vals = allMonths.map(m => bm[m] || 0);
  const mx = Math.max(...vals, 1);
  document.getElementById(elId).innerHTML = allMonths.map((m, i) => `
    <div class="bar-col">
      <div class="bar-v">${vals[i] ? (vals[i]/1000).toFixed(1)+'k' : ''}</div>
      <div class="bar-body" style="height:${Math.max(3, Math.round(vals[i]/mx*95))}px;background:${i===allMonths.length-1?'var(--g1)':'var(--g3)'}"></div>
      <div class="bar-lbl">${m.split(' ')[0]}</div>
    </div>`).join('');
}

// ════════════════════════════════════════════
// CLIENTS
// ════════════════════════════════════════════
function filterClients(f, btn) {
  clientFilter = f;
  document.querySelectorAll('#page-clients .fb').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  renderClients();
}
function renderClients() {
  let list = Object.values(clientMap);
  if (clientFilter === 'active') list = list.filter(c => c.ads.some(a => a.status === 'قيد العمل'));
  else if (clientFilter === 'repeat') list = list.filter(c => c.ads.length > 1);
  else if (clientFilter === 'contract') list = list.filter(c => c.ads.some(a => a.type && a.type.includes('عقد')));
  list = [...list];
  const sort = document.getElementById('cl-sort').value;
  const getTotal = c => c.ads.reduce((s, a) => s + a.amount, 0);
  if (sort === 'amount') list.sort((a, b) => getTotal(b) - getTotal(a));
  else if (sort === 'latest') list.sort((a, b) => {
    const la = a.ads.map(x => x.adDate || '').sort().reverse()[0] || '';
    const lb = b.ads.map(x => x.adDate || '').sort().reverse()[0] || '';
    return lb.localeCompare(la);
  });
  else if (sort === 'repeat') list.sort((a, b) => b.ads.length - a.ads.length);
  else if (sort === 'status-active') { list = list.filter(c => c.clientStatus === 'نشط'); list.sort((a, b) => getTotal(b) - getTotal(a)); }
  else if (sort === 'status-ended') { list = list.filter(c => c.clientStatus === 'منتهي'); list.sort((a, b) => getTotal(b) - getTotal(a)); }
  document.getElementById('cl-cnt').textContent = list.length;
  document.getElementById('clients-grid').innerHTML = list.map(c => clientCard(c)).join('');
}
function clientCard(c) {
  const total = c.ads.reduce((s, a) => s + a.amount, 0);
  const isRepeat = c.ads.length > 1;
  const hasActive = c.ads.some(a => a.status === 'قيد العمل');
  const lastDate = c.ads.map(a => a.adDate || '').sort().reverse()[0] || '';
  const cs = c.clientStatus || 'نشط';
  const statusColors = {'نشط': '#1F618D', 'منتهي': '#7FCBA4', 'متوقف': '#9A9A80'};
  let topBorder = hasActive ? '3px solid var(--g2)' : isRepeat ? '3px solid var(--g3)' : 'none';
  let badges = '';
  if (hasActive) badges += `<span class="badge b-gold">قيد العمل</span>`;
  if (isRepeat) badges += `<span class="badge b-sand">متكرر · ${c.ads.length}</span>`;
  if (c.ads.some(a => a.type && a.type.includes('عقد'))) badges += `<span class="badge b-blue">عقد</span>`;
  const adsHtml = c.ads.map((a, i) => `
    <div class="cc-ad-row">
      <div class="ad-num">${i+1}</div>
      <div class="ad-info">
        <div class="ad-title">${a.notes || a.type || 'إعلان'}</div>
        <div class="ad-sub">${fmtDate(a.adDate)} ${a.city ? '· '+a.city : ''} ${ptag(a.platform)}
          <span class="badge ${a.status==='تمت'?'b-green':a.status==='قيد العمل'?'b-gold':'b-gray'}" style="font-size:9px">${a.status}</span>
        </div>
      </div>
      <div class="ad-amount">${a.amount ? fmtMoney(a.amount) : a.pct ? a.pct*100+'%' : '—'}</div>
    </div>`).join('');
  return `<div class="client-card" style="border-top:${topBorder}">
    <div class="cc-head">
      <div class="cc-name">${c.name}</div>
      <div class="cc-meta">آخر إعلان: ${fmtDate(lastDate)}</div>
      <div class="cc-badges">${badges}</div>
    </div>
    <div class="cc-stats">
      <div class="cc-stat"><div class="cc-stat-val">${c.ads.length}</div><div class="cc-stat-lbl">إعلان</div></div>
      <div class="cc-stat"><div class="cc-stat-val" style="color:var(--g1);font-size:13px">${total ? (total/1000).toFixed(1)+'k' : '—'}</div><div class="cc-stat-lbl">إجمالي ر.س</div></div>
      <div class="cc-stat"><div class="cc-stat-val" style="font-size:13px;color:${statusColors[cs]}">${cs}</div><div class="cc-stat-lbl">الحالة</div></div>
    </div>
    <div class="cc-ads">${adsHtml}</div>
  </div>`;
}

// ════════════════════════════════════════════
// WEEKLY PLAN
// ════════════════════════════════════════════
function renderWeekly() {
  if (!rawWeekly.length) {
    document.getElementById('weekly-content').innerHTML = `
      <div class="empty-state"><div class="icon">📅</div>
        <p>لا توجد بيانات في ورقة "خطة الاسبوع"<br>أضف بيانات في Google Sheets وأعد التحميل</p></div>`;
    return;
  }

  // Group rows by week — detect week separator rows (rows where first non-empty cell looks like a week title)
  // Simple approach: show all rows as a table
  const cols = Object.keys(rawWeekly[0]).filter(k => k && k !== 'null');

  // Try to detect sections (rows with a header-like value)
  const sections = [];
  let currentSection = null;

  rawWeekly.forEach(row => {
    const vals = Object.values(row).filter(v => v);
    if (vals.length === 1 || (vals.length > 0 && !row[cols[1]] && !row[cols[2]])) {
      // likely a section header
      if (currentSection) sections.push(currentSection);
      currentSection = { title: vals[0], rows: [] };
    } else if (vals.length > 0) {
      if (!currentSection) currentSection = { title: 'خطة الأسبوع', rows: [] };
      currentSection.rows.push(row);
    }
  });
  if (currentSection) sections.push(currentSection);

  const SECTION_COLORS = {
    'خطة النشر': '#8A9A72',
    'أفكار المحتوى': '#1F618D',
    'الإعلانات': '#2C2C2C',
    'مهام الفريق': '#C5C0A5',
  };

  document.getElementById('weekly-content').innerHTML = sections.map(sec => {
    if (!sec.rows.length) return '';
    const secCols = cols.filter(c => sec.rows.some(r => r[c]));
    const color = Object.keys(SECTION_COLORS).find(k => sec.title && sec.title.includes(k));
    const bg = color ? SECTION_COLORS[color] : '#5F6F52';
    const textColor = bg === '#C5C0A5' ? 'var(--ink)' : '#fff';

    return `<div class="week-section">
      <div class="week-section-head" style="background:${bg}">
        <h3 style="color:${textColor}">${sec.title || 'قسم'}</h3>
      </div>
      <div style="overflow-x:auto">
        <table class="tbl">
          <thead><tr>${secCols.map(c => `<th>${c}</th>`).join('')}</tr></thead>
          <tbody>
            ${sec.rows.map((r, ri) => `
              <tr>
                ${secCols.map(c => {
                  const v = r[c] || '';
                  const statusMap = {'لم يبدأ':'b-gray','قيد التنفيذ':'b-blue','مكتمل':'b-green','مؤجل':'b-gold'};
                  const isStatus = ['الحالة','حالة البريف','حالة السكريبت','الحالة العامة'].includes(c);
                  return `<td>${isStatus && statusMap[v] ? `<span class="badge ${statusMap[v]}">${v || '—'}</span>` : (v || '—')}</td>`;
                }).join('')}
              </tr>`).join('')}
          </tbody>
        </table>
      </div>
    </div>`;
  }).join('') || '<div class="empty-state"><div class="icon">📅</div><p>لا توجد بيانات منظمة في ورقة خطة الأسبوع</p></div>';
}

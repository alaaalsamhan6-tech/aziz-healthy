<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>عزيز هيلثي — الإعلانات</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --g1:#5F6F52;--g2:#8A9A72;--g3:#C5C0A5;--g4:#E8E2D2;
  --white:#fff;--surface:#F5F3EE;--border:#D6D0C0;
  --ink:#2C2C2C;--ink2:#5F6F52;--ink3:#9A9A80;
  --red:#C0392B;--red2:#FADBD8;--blue:#1F618D;--blue2:#D6EAF8;
  --gold:#856404;--gold2:#FFF3CD;--purple:#6C3483;--purple2:#EBDEF0;
}
body{font-family:'Cairo',sans-serif;background:var(--surface);color:var(--ink);min-height:100vh}
.nav{background:var(--g1);height:56px;display:flex;align-items:center;padding:0 2rem;gap:2rem;position:sticky;top:0;z-index:100;border-bottom:3px solid var(--g3)}
.nav-brand{color:#fff;font-size:17px;font-weight:700}
.nav-tabs{display:flex;gap:2px;margin-right:auto;flex-wrap:wrap}
.ntab{background:none;border:none;color:rgba(255,255,255,.6);padding:6px 14px;border-radius:6px;cursor:pointer;font-family:'Cairo',sans-serif;font-size:12px;font-weight:600;transition:.15s}
.ntab:hover{color:#fff;background:rgba(255,255,255,.1)}
.ntab.active{color:#fff;background:rgba(255,255,255,.2);border-bottom:2px solid var(--g4)}
.sync-bar{display:flex;align-items:center;gap:8px;font-size:11px;color:rgba(255,255,255,.7)}
.sync-dot{width:7px;height:7px;border-radius:50%;background:#4CAF50;flex-shrink:0}
.sync-dot.loading{background:#FFC107;animation:pulse 1s infinite}
.sync-dot.error{background:var(--red)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.refresh-btn{background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.3);color:#fff;border-radius:6px;padding:4px 10px;font-family:'Cairo',sans-serif;font-size:11px;cursor:pointer;transition:.15s}
.refresh-btn:hover{background:rgba(255,255,255,.25)}
.page{display:none;padding:2rem;max-width:1400px;margin:0 auto}.page.active{display:block}
/* KPI */
.kpi-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(155px,1fr));gap:14px;margin-bottom:2rem}
.kpi{background:var(--white);border-radius:12px;padding:1.1rem 1.25rem;border:1px solid var(--border);position:relative;overflow:hidden}
.kpi-label{font-size:11px;font-weight:600;color:var(--ink3);text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px}
.kpi-val{font-size:26px;font-weight:700;line-height:1;color:var(--ink)}
.kpi-sub{font-size:11px;color:var(--ink3);margin-top:6px}
.kpi-accent{position:absolute;top:0;right:0;width:4px;height:100%}
/* CARD */
.card{background:var(--white);border-radius:12px;border:1px solid var(--border);overflow:hidden;margin-bottom:1.5rem;padding:1.25rem}
.sh{display:flex;align-items:center;justify-content:space-between;margin-bottom:1.25rem;flex-wrap:wrap;gap:10px}
.sh h2{font-size:15px;font-weight:700;color:var(--ink);margin:0;display:flex;align-items:center;gap:8px}
.cnt{font-size:11px;color:var(--ink3);background:var(--surface);padding:2px 8px;border-radius:20px;border:1px solid var(--border)}
/* TABLE */
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{background:var(--surface);padding:10px 14px;text-align:right;font-weight:600;color:var(--ink3);border-bottom:1px solid var(--border);white-space:nowrap;font-size:11px;text-transform:uppercase;letter-spacing:.3px}
.tbl td{padding:10px 14px;border-bottom:1px solid var(--border);color:var(--ink);vertical-align:middle}
.tbl tr:last-child td{border-bottom:none}
.tbl tr:hover td{background:var(--surface)}
/* CLIENT CARDS */
.clients-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:16px}
.client-card{background:var(--white);border-radius:14px;border:1px solid var(--border);overflow:hidden;transition:.2s}
.client-card:hover{box-shadow:0 4px 20px rgba(95,111,82,.12)}
.client-card.has-active{border-top:3px solid var(--g2)}
.client-card.is-repeat:not(.has-active){border-top:3px solid var(--g3)}
.cc-head{padding:14px 16px 10px;border-bottom:1px solid var(--border)}
.cc-name{font-size:15px;font-weight:700;color:var(--ink);margin-bottom:8px}
.cc-meta-row{display:flex;gap:16px;flex-wrap:wrap}
.cc-meta-item{font-size:12px;color:var(--ink3)}
.cc-meta-item strong{color:var(--ink);font-weight:600}
.cc-badges{margin-top:8px;display:flex;gap:4px;flex-wrap:wrap}
/* AD ITEMS inside card */
.cc-ads{padding:12px 16px}
.cc-ad-item{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:10px 14px;margin-bottom:8px}
.cc-ad-item:last-child{margin-bottom:0}
.cc-ad-header{font-size:12px;font-weight:700;color:var(--g1);margin-bottom:6px}
.cc-ad-details{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}
.cc-ad-field{font-size:11px}
.cc-ad-field .lbl{color:var(--ink3);display:block;margin-bottom:2px}
.cc-ad-field .val{font-weight:600;color:var(--ink);font-size:12px}
.cc-ad-field .val.amount{color:var(--g1);font-size:13px}
/* BADGES */
.badge{display:inline-flex;align-items:center;padding:2px 8px;border-radius:20px;font-size:10px;font-weight:700;white-space:nowrap}
.b-green{background:#D5F5E3;color:#1A7A4A}
.b-olive{background:#E8EDE0;color:var(--g1)}
.b-blue{background:var(--blue2);color:var(--blue)}
.b-gold{background:var(--gold2);color:var(--gold)}
.b-red{background:var(--red2);color:var(--red)}
.b-gray{background:#F0F0F0;color:#666}
.b-sand{background:var(--g4);color:var(--g1)}
.b-purple{background:var(--purple2);color:var(--purple)}
/* PLATFORM TAGS */
.ptag{display:inline-flex;align-items:center;padding:1px 7px;border-radius:5px;font-size:9px;font-weight:700}
.p-tiktok{background:#1A1A1A;color:#fff}.p-snap{background:#FFFC00;color:#1A1A1A}
.p-insta{background:linear-gradient(45deg,#f09433,#dc2743,#bc1888);color:#fff}
.p-all{background:var(--g2);color:#fff}.p-x{background:#000;color:#fff}.p-yt{background:#FF0000;color:#fff}
/* FILTERS */
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:1.25rem;align-items:center}
.fb{background:var(--white);border:1px solid var(--border);border-radius:20px;padding:5px 14px;font-family:'Cairo',sans-serif;font-size:12px;font-weight:500;cursor:pointer;color:var(--ink2);transition:.15s}
.fb.active{background:var(--g1);color:#fff;border-color:var(--g1)}
.fb:hover:not(.active){background:var(--surface)}
.fsel{border:1px solid var(--border);border-radius:20px;padding:5px 14px;font-family:'Cairo',sans-serif;font-size:12px;color:var(--ink);background:var(--white);cursor:pointer;outline:none}
.fsel:focus{border-color:var(--g1)}
/* GRID */
.g2{display:grid;grid-template-columns:1fr 1fr;gap:1.5rem}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:1.5rem}
@media(max-width:800px){.g2,.g3{grid-template-columns:1fr}}
/* CHARTS */
.bar-chart{display:flex;align-items:flex-end;gap:5px;height:130px;overflow-x:auto;padding-bottom:4px;direction:ltr}
.bar-col{display:flex;flex-direction:column;align-items:center;gap:3px;flex:1;min-width:38px}
.bar-body{border-radius:5px 5px 0 0;width:100%;background:var(--g3);min-height:3px;transition:.3s}
.bar-lbl{font-size:9px;color:var(--ink3);font-weight:600;text-transform:uppercase}
.bar-v{font-size:9px;font-weight:700;color:var(--g1)}
.bar-trend{font-size:9px;font-weight:700}
/* PROGRESS */
.progress-bar{background:var(--g4);border-radius:99px;height:5px;overflow:hidden;margin-top:4px}
.progress-fill{height:100%;border-radius:99px;background:var(--g2)}
/* LEGEND */
.legend-row{display:flex;align-items:center;gap:8px;padding:7px 0;font-size:12px;border-bottom:1px solid var(--border)}
.legend-row:last-child{border:none}
/* PIPELINE */
.pipeline{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}
@media(max-width:1100px){.pipeline{grid-template-columns:repeat(2,1fr)}}
@media(max-width:600px){.pipeline{grid-template-columns:1fr}}
.pl-col{background:var(--white);border-radius:12px;border:1px solid var(--border);min-height:180px}
.pl-head{padding:12px 14px;border-bottom-width:2px;border-bottom-style:solid;font-size:12px;font-weight:700;display:flex;justify-content:space-between;align-items:center}
.pl-body{padding:10px;display:flex;flex-direction:column;gap:8px}
.pl-card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:10px}
.pl-dates{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:8px}
.pl-date-box{background:var(--white);border:1px solid var(--border);border-radius:8px;padding:6px 8px;text-align:center}
.pl-date-lbl{font-size:9px;font-weight:700;text-transform:uppercase}
.pl-date-val{font-size:11px;font-weight:700;color:var(--ink);margin-top:2px}
/* FIN */
.fin-row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--border)}
.fin-row:last-child{border:none}
/* WEEKLY */
.wk-section{background:var(--white);border-radius:12px;border:1px solid var(--border);overflow:hidden;margin-bottom:1.5rem}
.wk-head{padding:12px 16px;display:flex;align-items:center;justify-content:space-between}
.wk-head h3{color:#fff;font-size:14px;font-weight:700;margin:0}
/* TOAST */
.toast{position:fixed;bottom:1.5rem;right:1.5rem;background:var(--g1);color:#fff;padding:10px 20px;border-radius:10px;font-size:13px;font-weight:700;z-index:999;opacity:0;transform:translateY(8px);transition:.3s;pointer-events:none;border:1px solid var(--g2)}
.toast.show{opacity:1;transform:translateY(0)}
.empty-state{text-align:center;padding:3rem 0;color:var(--ink3)}
.empty-state .icon{font-size:48px;margin-bottom:12px}
input[type="date"]{direction:ltr;text-align:left}
</style>
</head>
<body>

<nav class="nav">
  <div class="nav-brand">عزيز هيلثي</div>
  <div class="nav-tabs">
    <button class="ntab active" onclick="showPage('overview',this)">نظرة عامة</button>
    <button class="ntab" onclick="showPage('upcoming',this)">الإعلانات القادمة</button>
    <button class="ntab" onclick="showPage('clients',this)">العملاء والإعلانات</button>
    <button class="ntab" onclick="showPage('finance',this)">المالية</button>
    <button class="ntab" onclick="showPage('weekly',this)">خطة الأسبوع</button>
  </div>
  <div class="sync-bar">
    <div class="sync-dot loading" id="sync-dot"></div>
    <span id="sync-text">جاري التحميل...</span>
    <button class="refresh-btn" onclick="loadAll(true)">↻ تحديث</button>
  </div>
</nav>

<!-- OVERVIEW -->
<div class="page active" id="page-overview">
  <div class="kpi-row" id="ov-kpis"></div>
  <div class="card">
    <div class="sh">
      <h2>الدخل الشهري</h2>
      <select class="fsel" id="ov-year" onchange="renderOverview()">
        <option value="all">كل السنوات</option>
      </select>
    </div>
    <div class="bar-chart" id="ov-chart"></div>
  </div>
  <div class="g3">
    <div class="card"><div class="sh"><h2>أنواع الإعلانات</h2></div><div id="ov-types"></div></div>
    <div class="card"><div class="sh"><h2>عقود قيد العمل</h2></div><div id="ov-active"></div></div>
    <div class="card"><div class="sh"><h2>العملاء المتكررون</h2></div><div id="ov-repeats"></div></div>
  </div>
  <div class="card"><div class="sh"><h2>العملاء الأعلى دخلاً</h2></div><div id="ov-top"></div></div>
</div>

<!-- UPCOMING -->
<div class="page" id="page-upcoming">
  <div class="sh"><h2>الإعلانات القادمة <span class="cnt" id="up-cnt">—</span></h2></div>
  <div class="pipeline" id="pipeline"></div>
</div>

<!-- CLIENTS -->
<div class="page" id="page-clients">
  <div class="sh"><h2>العملاء والإعلانات <span class="cnt" id="cl-cnt">—</span></h2></div>
  <div class="filters">
    <button class="fb active" onclick="filterClients('all',this)">الكل</button>
    <button class="fb" onclick="filterClients('active',this)">قيد العمل</button>
    <button class="fb" onclick="filterClients('repeat',this)">متكرر</button>
    <button class="fb" onclick="filterClients('contract',this)">عقد</button>
    <div style="margin-right:auto;display:flex;gap:8px;align-items:center">
      <span style="font-size:12px;color:var(--ink3)">ترتيب:</span>
      <select class="fsel" id="cl-sort" onchange="renderClients()">
        <option value="amount">الأعلى مبلغاً</option>
        <option value="latest">الأحدث</option>
        <option value="repeat">الأكثر تكراراً</option>
        <option value="status-active">نشط</option>
        <option value="status-ended">منتهي</option>
      </select>
    </div>
  </div>
  <div class="clients-grid" id="clients-grid"></div>
</div>

<!-- FINANCE -->
<div class="page" id="page-finance">
  <div class="sh"><h2>المالية</h2></div>
  <div class="kpi-row" id="fin-kpis"></div>
  <div class="card">
    <div class="sh">
      <h2>الدخل الشهري</h2>
      <select class="fsel" id="fin-year" onchange="renderFinance()">
        <option value="all">كل السنوات</option>
      </select>
    </div>
    <div class="bar-chart" id="fin-chart"></div>
  </div>
  <div class="card" style="padding:0;overflow:hidden">
    <div style="padding:12px 16px;background:var(--red)">
      <h3 style="color:#fff;font-size:13px;font-weight:700;margin:0">المصروفات</h3>
    </div>
    <div style="overflow-x:auto">
      <table class="tbl">
        <thead><tr><th>التاريخ</th><th>البند</th><th>المبلغ</th><th>الفئة</th><th>ملاحظات</th></tr></thead>
        <tbody id="exp-tbody"></tbody>
      </table>
    </div>
  </div>
</div>

<!-- WEEKLY -->
<div class="page" id="page-weekly">
  <div class="sh"><h2>خطة الأسبوع</h2></div>
  <div id="weekly-content">
    <div class="empty-state"><div class="icon">📅</div><p>جاري تحميل خطة الأسبوع...</p></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ══════════════════════════════════════
// CONFIG
// ══════════════════════════════════════
const SHEET_ID = '1BoqP-1ekwufxUd8QYXNtTO_DHsgPe0hu';

const SHEET_NAMES = {
  ads:      'الاعلانات',
  clients:  'العملاء',
  upcoming: 'الاعلانات القادمة',
  finance:  'المالية',
  weekly:   'خطة الاسبوع',
};

// ══════════════════════════════════════
// STATE
// ══════════════════════════════════════
let rawAds = [], rawClients = [], rawUpcoming = [], rawExpenses = [], rawWeekly = [];
let clientMap = {};
let clientFilter = 'all';

// ══════════════════════════════════════
// UTILS
// ══════════════════════════════════════
const ARM = ['يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];
const MEN = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

function parseGvizDate(s) {
  if (!s) return null;
  if (typeof s === 'string' && s.startsWith('Date(')) {
    const p = s.slice(5,-1).split(',').map(Number);
    return new Date(p[0], p[1], p[2]);
  }
  const d = new Date(s);
  return isNaN(d) ? null : d;
}

function fmtDate(s) {
  if (!s) return '';
  const d = parseGvizDate(s);
  if (!d) return s;
  return `${d.getDate()} ${ARM[d.getMonth()]} ${d.getFullYear()}`;
}

// Parse money from any format: "1,500 ر.س" / "1500" / "1,000 ريال" / 1500 / 0.30
function parseMoney(v) {
  if (v === null || v === undefined || v === '') return 0;
  if (typeof v === 'number') return isNaN(v) ? 0 : v;
  const s = String(v).replace(/[^\d.]/g, '');
  const n = parseFloat(s);
  return isNaN(n) ? 0 : n;
}

// Parse percentage: handles 0.30 → 30, 30 → 30, "30%" → 30
function parsePct(v) {
  if (!v && v !== 0) return 0;
  if (typeof v === 'number') {
    // Google Sheets stores 30% as 0.3
    return v <= 1 ? Math.round(v * 100) : Math.round(v);
  }
  const s = String(v).replace('%','').trim();
  const n = parseFloat(s);
  return isNaN(n) ? 0 : n <= 1 ? Math.round(n * 100) : Math.round(n);
}

function fmtMoney(n) {
  if (!n && n !== 0) return '';
  const num = parseMoney(n);
  if (num === 0) return '';
  return num.toLocaleString('ar-SA') + ' ر.س';
}

function monthKey(s) {
  if (!s) return '';
  const d = parseGvizDate(s);
  if (!d) return '';
  return `${MEN[d.getMonth()]} ${d.getFullYear()}`;
}

function getMonthYear(s) {
  const d = parseGvizDate(s);
  if (!d) return null;
  return { mo: d.getMonth(), yr: d.getFullYear(), key: `${MEN[d.getMonth()]} ${d.getFullYear()}` };
}

function showPage(id, btn) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.ntab').forEach(t => t.classList.remove('active'));
  document.getElementById('page-'+id).classList.add('active');
  btn.classList.add('active');
}

function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2800);
}

function setSyncing(loading, error) {
  const dot = document.getElementById('sync-dot');
  const txt = document.getElementById('sync-text');
  dot.className = 'sync-dot' + (loading ? ' loading' : error ? ' error' : '');
  txt.textContent = loading ? 'جاري التحميل...' : error ? 'خطأ في الاتصال' : `آخر تحديث: ${new Date().toLocaleTimeString('ar-SA', {hour:'2-digit',minute:'2-digit'})}`;
}

function ptag(p) {
  if (!p) return '';
  const map = {'تيك توك':'p-tiktok','سناب':'p-snap','انستقرام':'p-insta','جميع المنصات':'p-all','X':'p-x','يوتيوب':'p-yt'};
  return `<span class="ptag ${map[p]||'p-all'}">${p}</span>`;
}

function statusBadge(s) {
  if (!s) return '';
  const map = {
    'تمت':'b-green','تمت':'b-green','قيد العمل':'b-gold','ملغي':'b-red',
    'نشط':'b-blue','منتهي':'b-gray','متوقف':'b-gray','متكرر':'b-sand',
    'لم يبدأ':'b-gray','قيد التنفيذ':'b-blue','مكتمل':'b-green','مؤجل':'b-gold',
  };
  return `<span class="badge ${map[s]||'b-gray'}">${s}</span>`;
}

// ══════════════════════════════════════
// FETCH — Google Visualization API
// No-cache via timestamp param
// ══════════════════════════════════════
async function fetchSheet(sheetName) {
  const ts = Date.now();
  const url = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&sheet=${encodeURIComponent(sheetName)}&ts=${ts}`;
  const res = await fetch(url, { cache: 'no-store' });
  const text = await res.text();
  const match = text.match(/google\.visualization\.Query\.setResponse\(([\s\S]*)\)/);
  if (!match) throw new Error(`Could not parse response for sheet: ${sheetName}`);
  const json = JSON.parse(match[1]);
  if (!json.table) throw new Error(`No table data for sheet: ${sheetName}`);
  const cols = json.table.cols.map(c => (c.label || c.id || '').trim());
  const rows = (json.table.rows || []).map(r => {
    const obj = {};
    cols.forEach((col, i) => {
      if (!col) return;
      const cell = r.c && r.c[i];
      if (!cell) { obj[col] = null; return; }
      // Use formatted value if available, otherwise raw value
      obj[col] = (cell.f !== null && cell.f !== undefined) ? cell.f : cell.v;
      // Also store raw numeric value for money/pct parsing
      if (typeof cell.v === 'number') obj['_raw_'+col] = cell.v;
    });
    return obj;
  });
  return { cols, rows };
}

// ══════════════════════════════════════
// LOAD ALL
// ══════════════════════════════════════
async function loadAll(manual) {
  setSyncing(true);

  async function safeLoad(sheetKey) {
    try {
      return await fetchSheet(SHEET_NAMES[sheetKey]);
    } catch(e) {
      console.error(`[${sheetKey}] فشل تحميل الورقة "${SHEET_NAMES[sheetKey]}":`, e.message);
      return null;
    }
  }

  const [adsData, clientsData, upData, finData, weekData] = await Promise.all([
    safeLoad('ads'),
    safeLoad('clients'),
    safeLoad('upcoming'),
    safeLoad('finance'),
    safeLoad('weekly'),
  ]);

  // Check if ALL failed (likely CORS / sharing issue)
  if (!adsData && !clientsData && !upData && !finData && !weekData) {
    setSyncing(false, true);
    const errHTML = `
      <div style="background:#fff;border:2px solid var(--red);border-radius:12px;padding:2rem;margin:1rem 0;text-align:center">
        <div style="font-size:32px;margin-bottom:12px">⚠️</div>
        <div style="font-size:16px;font-weight:700;color:var(--red);margin-bottom:8px">تعذر الاتصال بـ Google Sheets</div>
        <div style="font-size:13px;color:var(--ink3);line-height:1.8">
          تأكد أن ملف Google Sheets مضبوط على:<br>
          <b>Share → Anyone with the link → Viewer</b><br><br>
          الرابط المستخدم:<br>
          <code style="font-size:11px;color:var(--blue);word-break:break-all">
            https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?...
          </code>
        </div>
        <button onclick="loadAll(true)" style="margin-top:16px;background:var(--g1);color:#fff;border:none;padding:8px 20px;border-radius:8px;font-family:Cairo,sans-serif;font-size:13px;font-weight:700;cursor:pointer">↻ إعادة المحاولة</button>
      </div>`;
    document.getElementById('ov-kpis').innerHTML = errHTML;
    toast('❌ تعذر الاتصال بـ Google Sheets');
    return;
  }

  try {
    // ── Parse Ads ──
    if (adsData) {
      rawAds = adsData.rows.filter(r => {
        const idRaw = r['_raw_ID'] ?? r['_raw_' + adsData.cols[0]];
        const id = idRaw !== undefined ? idRaw : parseFloat(String(r[adsData.cols[0]]||'').replace(/[^\d.]/g,''));
        return id > 0 && !isNaN(id);
      }).map(r => {
        const amountRaw = r['_raw_المبلغ (ريال)'] ?? r['_raw_المبلغ'] ?? r['_raw_القيمة'];
        const amount = (amountRaw !== undefined && amountRaw !== null) ? amountRaw : parseMoney(r['المبلغ (ريال)'] || r['المبلغ'] || r['القيمة'] || '');
        const pctRaw = r['_raw_النسبة %'] ?? r['_raw_النسبة'];
        const pct = (pctRaw !== undefined && pctRaw !== null) ? parsePct(pctRaw) : parsePct(r['النسبة %'] || r['النسبة'] || '');
        return {
          brand:    (r['اسم الشركة / البراند'] || r['اسم الشركة'] || r['الشركة'] || '').trim(),
          amount,
          pct,
          type:     (r['نوع الإعلان'] || r['النوع'] || '').trim(),
          status:   (r['المرحلة'] || r['الحالة'] || '').trim(),
          platform: (r['المنصة'] || '').trim(),
          city:     (r['المدينة'] || '').trim(),
          adDate:   r['تاريخ الإعلان'] || null,
          pubDate:  r['تاريخ النشر'] || null,
          notes:    (r['ملاحظات'] || '').trim(),
        };
      }).filter(r => r.brand);
    }

    // ── Parse Clients (status override) ──
    const clientStatusMap = {};
    if (clientsData) {
      clientsData.rows.filter(r => r['اسم العميل / البراند'] || r['اسم العميل']).forEach(r => {
        const name = (r['اسم العميل / البراند'] || r['اسم العميل'] || '').trim();
        const status = (r['حالة العميل'] || r['الحالة'] || '').trim();
        if (name) clientStatusMap[name] = status || 'نشط';
      });
    }

    // ── Build Client Map ──
    clientMap = {};
    rawAds.forEach(a => {
      const k = a.brand;
      if (!clientMap[k]) {
        clientMap[k] = { name: k, ads: [], clientStatus: clientStatusMap[k] || 'نشط' };
      }
      clientMap[k].ads.push(a);
    });

    // ── Parse Upcoming ──
    if (upData) {
      rawUpcoming = upData.rows.filter(r => {
        const name = (r['اسم العميل'] || r[upData.cols[0]] || '').trim();
        return name && name !== 'اسم العميل' && name !== upData.cols[0];
      }).map(r => ({
        name:     (r['اسم العميل'] || r[upData.cols[0]] || '').trim(),
        platform: (r['المنصة'] || '').trim(),
        city:     (r['المدينة'] || '').trim(),
        adDate:   r['تاريخ الاتفاق'] || r['تاريخ الإعلان'] || null,
        pubDate:  r['تاريخ النشر المتوقع'] || r['تاريخ النشر'] || null,
        stage:    (r['المرحلة'] || 'غير معتمد').trim(),
        assigned: (r['المسؤول'] || '').trim(),
        amount:   parseMoney(r['المبلغ المتوقع'] || r['المبلغ'] || ''),
        notes:    (r['ملاحظات'] || '').trim(),
      }));
    }

    // ── Parse Expenses ──
    if (finData) {
      rawExpenses = finData.rows.filter(r => {
        const name = String(r['البند'] || '').trim();
        const amt = r['_raw_المبلغ (ر.س)'] ?? r['_raw_المبلغ'] ?? parseMoney(r['المبلغ (ر.س)'] || r['المبلغ'] || '');
        return name && amt > 0;
      }).map(r => ({
        date:   r['التاريخ'] || null,
        name:   String(r['البند'] || '').trim(),
        amount: r['_raw_المبلغ (ر.س)'] ?? r['_raw_المبلغ'] ?? parseMoney(r['المبلغ (ر.س)'] || r['المبلغ'] || ''),
        cat:    String(r['الفئة'] || '').trim(),
        notes:  String(r['ملاحظات'] || '').trim(),
      }));
    }

    // ── Parse Weekly ──
    if (weekData) rawWeekly = weekData;

    buildYearOptions();
    renderOverview();
    renderClients();
    renderPipeline();
    renderFinance();
    renderWeekly();

    setSyncing(false);
    if (manual) toast('✅ تم تحديث البيانات من Google Sheets');

  } catch(e) {
    setSyncing(false, true);
    console.error('خطأ في معالجة البيانات:', e);
    toast('❌ خطأ في معالجة البيانات — تفاصيل في Console');
  }
}

function buildYearOptions() {
  const years = [...new Set(rawAds.map(a => {
    const mk = monthKey(a.adDate || a.pubDate);
    if (!mk) return null;
    return parseInt(mk.split(' ')[1]);
  }).filter(Boolean))].sort();
  const min = Math.min(2025, ...(years.length ? years : [2025]));
  const opts = ['<option value="all">كل السنوات</option>'];
  for (let y = min; y <= 2030; y++) opts.push(`<option value="${y}">${y}</option>`);
  ['ov-year','fin-year'].forEach(id => {
    const el = document.getElementById(id);
    if (el) el.innerHTML = opts.join('');
  });
}

  // Types breakdown
  const types = {};

    const k = a.type || 'غير محدد';

  });
  const typeColors = {'مرة واحدة':'var(--blue)','عقد':'var(--g1)','عقد + نسبة':'var(--g3)','غير محدد':'var(--ink3)'};
  document.getElementById('ov-types').innerHTML = Object.entries(types).map(([k,v]) => `
    <div class="legend-row">
      <div style="width:10px;height:10px;border-radius:50%;background:${typeColors[k]||'var(--g3)'};flex-shrink:0"></div>

    </div>`).join('') || '<div style="color:var(--ink3);font-size:13px">لا توجد بيانات</div>';

  // Active contracts
  const activeCl = cl.filter(c => c.ads.some(a => a.status === 'قيد العمل'));
  document.getElementById('ov-active').innerHTML = activeCl.length ? activeCl.map(c => {
    const activeAds = c.ads.filter(a => a.status === 'قيد العمل');
    const total = activeAds.reduce((s,a)=>s+a.amount,0);

      <div>
        <div style="font-weight:600;font-size:13px">${c.name}</div>

  // Repeat clients
  const reps = [...cl].filter(c=>c.ads.length>1).sort((a,b)=>b.ads.length-a.ads.length).slice(0,5);
  document.getElementById('ov-repeats').innerHTML = reps.length ? reps.map(c => `
    <div class="fin-row">

// ══════════════════════════════════════
// BAR CHART — with monthly trend arrows
// ══════════════════════════════════════
function renderBarChart(elId, yf) {
  const bm = {};
  rawAds.filter(a => a.status === 'تمت').forEach(a => {
    const d = a.adDate || a.pubDate;
    if (!d) return;
    const mk = monthKey(d);
    if (!mk) return;
    const yr = parseInt(mk.split(' ')[1]);
    if (yf !== 'all' && yr !== +yf) return;
    bm[mk] = (bm[mk]||0) + a.amount;
  });

  const keys = Object.keys(bm);
  if (!keys.length) {
    document.getElementById(elId).innerHTML = '<div style="color:var(--ink3);font-size:12px;padding:20px 0;text-align:center">لا توجد بيانات للسنة المختارة</div>';
    return;
  }

  // Sort chronologically
  const sorted = keys.map(k => {
    const [mo, yr] = k.split(' ');
    return { key: k, date: new Date(yr, MEN.indexOf(mo), 1), val: bm[k] };
  }).sort((a,b) => a.date - b.date);

  const mx = Math.max(...sorted.map(s=>s.val), 1);

  document.getElementById(elId).innerHTML = sorted.map((s, i) => {
    const prev = i > 0 ? sorted[i-1].val : null;
    let trend = '';
    if (prev !== null) {
      const diff = s.val - prev;
      const pct = prev > 0 ? Math.round(diff/prev*100) : 0;
      if (diff > 0) trend = `<div class="bar-trend" style="color:#1A7A4A">↑${pct}%</div>`;
      else if (diff < 0) trend = `<div class="bar-trend" style="color:var(--red)">↓${Math.abs(pct)}%</div>`;
      else trend = `<div class="bar-trend" style="color:var(--ink3)">—</div>`;
    } else {
      trend = `<div class="bar-trend" style="color:var(--ink3);font-size:8px">لا توجد مقارنة سابقة</div>`;
    }
    return `<div class="bar-col">
      ${trend}
      <div class="bar-v">${(s.val/1000).toFixed(1)}k</div>
      <div class="bar-body" style="height:${Math.max(3,Math.round(s.val/mx*90))}px;background:${i===sorted.length-1?'var(--g1)':'var(--g3)'}"></div>
      <div class="bar-lbl">${s.key.split(' ')[0]}</div>
    </div>`;
  }).join('');
}

// ══════════════════════════════════════
// CLIENTS
// ══════════════════════════════════════
function filterClients(f, btn) {
  clientFilter = f;
  document.querySelectorAll('#page-clients .fb').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  renderClients();
}
function renderClients() {
  let list = Object.values(clientMap);
  if (clientFilter === 'active') list = list.filter(c=>c.ads.some(a=>a.status==='قيد العمل'));
  else if (clientFilter === 'repeat') list = list.filter(c=>c.ads.length>1);
  else if (clientFilter === 'contract') list = list.filter(c=>c.ads.some(a=>a.type&&a.type.includes('عقد')));
  list = [...list];
  const sort = document.getElementById('cl-sort').value;
  const getTotal = c => c.ads.reduce((s,a)=>s+a.amount,0);
  if (sort==='amount') list.sort((a,b)=>getTotal(b)-getTotal(a));
  else if (sort==='latest') list.sort((a,b)=>{
    const la = a.ads.map(x=>x.adDate||'').sort().reverse()[0]||'';
    const lb = b.ads.map(x=>x.adDate||'').sort().reverse()[0]||'';
    return lb.localeCompare(la);
  });
  else if (sort==='repeat') list.sort((a,b)=>b.ads.length-a.ads.length);
  else if (sort==='status-active'){list=list.filter(c=>c.clientStatus==='نشط');list.sort((a,b)=>getTotal(b)-getTotal(a));}
  else if (sort==='status-ended'){list=list.filter(c=>c.clientStatus==='منتهي');list.sort((a,b)=>getTotal(b)-getTotal(a));}
  document.getElementById('cl-cnt').textContent = list.length;
  document.getElementById('clients-grid').innerHTML = list.map(c=>clientCard(c)).join('') ||
    '<div class="empty-state"><div class="icon">👥</div><p>لا توجد بيانات</p></div>';
}

function clientCard(c) {
  const total = c.ads.reduce((s,a)=>s+a.amount,0);
  const isRepeat = c.ads.length > 1;
  const hasActive = c.ads.some(a=>a.status==='قيد العمل');
  const cs = c.clientStatus || 'نشط';
  const statusColors = {'نشط':'#1F618D','منتهي':'#7FCBA4','متوقف':'#9A9A80'};
  let topBorder = hasActive ? '3px solid var(--g2)' : isRepeat ? '3px solid var(--g3)' : 'none';

  let badges = '';
  if (hasActive) badges += `<span class="badge b-gold">قيد العمل</span>`;
  if (isRepeat) badges += `<span class="badge b-sand">متكرر · ${c.ads.length}</span>`;
  if (c.ads.some(a=>a.type&&a.type.includes('عقد'))) badges += `<span class="badge b-blue">عقد</span>`;

  // Ads list
  const adsHtml = c.ads.map((a, i) => {
    const amt = a.amount > 0 ? fmtMoney(a.amount) : (a.pct > 0 ? `نسبة ${a.pct}%` : '');
    const adType = a.type || '';
    const adStatus = a.status || '';
    const adPlatform = a.platform ? ptag(a.platform) : '';
    const adCity = a.city ? `<span style="font-size:11px;color:var(--ink3)">${a.city}</span>` : '';
    const adDate = fmtDate(a.adDate);
    const adNotes = a.notes ? `<div class="cc-ad-field"><span class="lbl">ملاحظات</span><span class="val">${a.notes}</span></div>` : '';
    return `<div class="cc-ad-item">
      <div class="cc-ad-header">الإعلان ${i+1} ${adPlatform} ${adCity}</div>
      <div class="cc-ad-details">
        ${adType ? `<div class="cc-ad-field"><span class="lbl">نوع الإعلان</span><span class="val">${adType}</span></div>` : ''}
        ${adStatus ? `<div class="cc-ad-field"><span class="lbl">الحالة</span><span class="val">${statusBadge(adStatus)}</span></div>` : ''}
        ${amt ? `<div class="cc-ad-field"><span class="lbl">القيمة</span><span class="val amount">${amt}</span></div>` : ''}
        ${adDate ? `<div class="cc-ad-field"><span class="lbl">التاريخ</span><span class="val">${adDate}</span></div>` : ''}
        ${adNotes}
      </div>
    </div>`;
  }).join('');

  return `<div class="client-card" style="border-top:${topBorder}">
    <div class="cc-head">
      <div class="cc-name">${c.name}</div>
      <div class="cc-meta-row">
        <div class="cc-meta-item">الحالة: <strong style="color:${statusColors[cs]}">${cs}</strong></div>
        <div class="cc-meta-item">الإعلانات: <strong>${c.ads.length}</strong></div>
        ${total > 0 ? `<div class="cc-meta-item">الإجمالي: <strong style="color:var(--g1)">${fmtMoney(total)}</strong></div>` : ''}
      </div>
      ${badges ? `<div class="cc-badges">${badges}</div>` : ''}
    </div>
    <div class="cc-ads">${adsHtml}</div>
  </div>`;
}

// ══════════════════════════════════════
// PIPELINE
// ══════════════════════════════════════
const STAGES = ['غير معتمد','معتمد','التصوير','المونتاج','النشر'];
const STAGE_COLORS = {'غير معتمد':'#C0392B','معتمد':'#6C3483','التصوير':'#D35400','المونتاج':'#1F618D','النشر':'#1A7A4A'};

function renderPipeline() {
  document.getElementById('up-cnt').textContent = rawUpcoming.length;
  if (!rawUpcoming.length) {
    document.getElementById('pipeline').innerHTML = '<div class="empty-state" style="grid-column:1/-1"><div class="icon">📋</div><p>لا توجد إعلانات قادمة في الشيت</p></div>';
    return;
  }
  document.getElementById('pipeline').innerHTML = STAGES.map(stage => {
    const items = rawUpcoming.filter(u=>u.stage===stage);
    return `<div class="pl-col">
      <div class="pl-head" style="border-bottom-color:${STAGE_COLORS[stage]}">
        <span>${stage}</span><span class="cnt">${items.length}</span>
      </div>
      <div class="pl-body">
        ${items.length ? items.map(u=>`
          <div class="pl-card">
            <div style="font-size:13px;font-weight:700;color:var(--ink)">${u.name}</div>
            ${u.city?`<div style="font-size:10px;color:var(--ink3);margin-top:2px">${u.city}</div>`:''}
            <div class="pl-dates">
              <div class="pl-date-box">
                <div class="pl-date-lbl" style="color:var(--g1)">الإعلان</div>
                <div class="pl-date-val">${fmtDate(u.adDate)||'—'}</div>
              </div>
              <div class="pl-date-box">
                <div class="pl-date-lbl" style="color:#1A7A4A">النشر</div>
                <div class="pl-date-val">${fmtDate(u.pubDate)||'—'}</div>
              </div>
            </div>
            <div style="display:flex;justify-content:space-between;align-items:center;margin-top:8px">
              ${ptag(u.platform)}
              ${u.assigned?`<span style="font-size:10px;color:var(--ink3)">${u.assigned}</span>`:''}
            </div>
            ${u.amount>0?`<div style="font-size:12px;font-weight:700;color:var(--g1);margin-top:6px">${fmtMoney(u.amount)}</div>`:''}
          </div>`).join('')
        :'<div style="color:var(--ink3);font-size:12px;text-align:center;padding:20px 0">لا يوجد</div>'}
      </div>
    </div>`;
  }).join('');
}

// ══════════════════════════════════════
// FINANCE
// ══════════════════════════════════════
function renderFinance() {
  const doneAds = rawAds.filter(a=>a.status==='تمت');
  const totalIn = doneAds.reduce((s,a)=>s+a.amount,0);
  const inProgress = rawAds.filter(a=>a.status==='قيد العمل').reduce((s,a)=>s+a.amount,0);
  const totalExp = rawExpenses.reduce((s,e)=>s+e.amount,0);
  const net = totalIn - totalExp;

  document.getElementById('fin-kpis').innerHTML = `
    <div class="kpi"><div class="kpi-label">إجمالي الدخل (تمت)</div><div class="kpi-val">${totalIn>=1000?(totalIn/1000).toFixed(1)+'k':totalIn.toLocaleString('ar-SA')}</div><div class="kpi-sub">ريال سعودي</div><div class="kpi-accent" style="background:var(--g1)"></div></div>
    <div class="kpi"><div class="kpi-label">قيد العمل</div><div class="kpi-val">${inProgress>=1000?(inProgress/1000).toFixed(1)+'k':inProgress.toLocaleString('ar-SA')}</div><div class="kpi-sub">ريال سعودي</div><div class="kpi-accent" style="background:var(--gold)"></div></div>
    <div class="kpi"><div class="kpi-label">المصروفات</div><div class="kpi-val">${totalExp>=1000?(totalExp/1000).toFixed(1)+'k':totalExp.toLocaleString('ar-SA')}</div><div class="kpi-sub">ريال سعودي</div><div class="kpi-accent" style="background:var(--red)"></div></div>
    <div class="kpi"><div class="kpi-label">صافي الربح</div><div class="kpi-val" style="color:${net>=0?'var(--g1)':'var(--red)'}">${net>=1000?(net/1000).toFixed(1)+'k':net.toLocaleString('ar-SA')}</div><div class="kpi-sub">ريال سعودي</div><div class="kpi-accent" style="background:var(--g2)"></div></div>`;

  const yf = document.getElementById('fin-year').value;
  renderBarChart('fin-chart', yf);

  document.getElementById('exp-tbody').innerHTML = rawExpenses.length ? rawExpenses.map(e=>`
    <tr>
      <td style="font-size:12px;color:var(--ink3)">${fmtDate(e.date)||'—'}</td>
      <td style="font-weight:600">${e.name}</td>
      <td style="font-weight:700;color:var(--red)">${fmtMoney(e.amount)}</td>
      <td>${e.cat?statusBadge(e.cat)||`<span class="badge b-gray">${e.cat}</span>`:''}</td>
      <td style="font-size:11px;color:var(--ink3)">${e.notes||''}</td>
    </tr>`).join('')
  : '<tr><td colspan="5" style="text-align:center;color:var(--ink3);padding:24px">لا توجد مصروفات مسجلة في الشيت</td></tr>';
}

// ══════════════════════════════════════
// WEEKLY PLAN
// ══════════════════════════════════════
function renderWeekly() {
  const el = document.getElementById('weekly-content');
  if (!rawWeekly || !rawWeekly.rows || !rawWeekly.rows.length) {
    el.innerHTML = `<div class="empty-state"><div class="icon">📅</div>
      <p>لا توجد بيانات في ورقة "خطة الاسبوع"<br><small>أضف بيانات في Google Sheets وأعد التحميل</small></p></div>`;
    return;
  }

  const cols = rawWeekly.cols.filter(c=>c&&c.trim());
  const rows = rawWeekly.rows;

  // Detect sections: rows where only the first cell has a value (section header)
  const sections = [];
  let currentSection = null;

  rows.forEach(row => {
    const vals = cols.map(c=>row[c]).filter(v=>v!==null&&v!==undefined&&String(v).trim());
    if (!vals.length) return;

    const firstVal = cols.map(c=>row[c]).find(v=>v!==null&&v!==undefined&&String(v).trim());
    const otherVals = cols.slice(1).map(c=>row[c]).filter(v=>v!==null&&v!==undefined&&String(v).trim());

    // Section header = first col has value, rest are empty
    if (firstVal && otherVals.length === 0) {
      if (currentSection) sections.push(currentSection);
      currentSection = { title: String(firstVal).trim(), rows: [], cols: [] };
    } else if (firstVal && vals.length > 1) {
      if (!currentSection) currentSection = { title: 'خطة الأسبوع', rows: [], cols: [] };
      // First real row might be a header row
      if (!currentSection.cols.length) {
        currentSection.cols = cols.filter(c => row[c] !== null && row[c] !== undefined);
      }
      currentSection.rows.push(row);
    }
  });
  if (currentSection) sections.push(currentSection);

  const SECTION_COLORS = {
    'خطة النشر':'#8A9A72','أفكار المحتوى':'#1F618D','الإعلانات':'#2C2C2C',
    'مهام الفريق':'#5F6F52','المحتوى الجاهز':'#6C3483','المنشور':'#1A7A4A',
    'المهام':'#C5C0A5','ملاحظات':'#9A9A80',
  };

  if (!sections.length) {
    // Fallback: show all as one table
    el.innerHTML = `<div class="wk-section">
      <div class="wk-head" style="background:var(--g1)"><h3>خطة الأسبوع</h3></div>
      <div style="overflow-x:auto">
        <table class="tbl">
          <thead><tr>${cols.map(c=>`<th>${c}</th>`).join('')}</tr></thead>
          <tbody>${rows.map(r=>`<tr>${cols.map(c=>`<td>${r[c]!==null&&r[c]!==undefined?r[c]:''}</td>`).join('')}</tr>`).join('')}</tbody>
        </table>
      </div></div>`;
    return;
  }

  el.innerHTML = sections.filter(s=>s.rows.length>0).map(sec => {
    const colorKey = Object.keys(SECTION_COLORS).find(k=>sec.title&&sec.title.includes(k));
    const bg = colorKey ? SECTION_COLORS[colorKey] : 'var(--g1)';
    const textColor = bg === '#C5C0A5' ? 'var(--ink)' : '#fff';
    const secCols = sec.cols.length ? sec.cols : cols.filter(c=>sec.rows.some(r=>r[c]!==null&&r[c]!==undefined&&String(r[c]).trim()));
    const WK_STATUS = {'لم يبدأ':'b-gray','قيد التنفيذ':'b-blue','مكتمل':'b-green','مؤجل':'b-gold','تمت':'b-green','قيد العمل':'b-gold'};
    const statusCols = ['الحالة','حالة البريف','حالة السكريبت','الحالة العامة','الحالة الكتابة'];
    return `<div class="wk-section">
      <div class="wk-head" style="background:${bg}"><h3 style="color:${textColor}">${sec.title}</h3></div>
      <div style="overflow-x:auto">
        <table class="tbl">
          <thead><tr>${secCols.map(c=>`<th>${c}</th>`).join('')}</tr></thead>
          <tbody>
            ${sec.rows.map((r,ri)=>`<tr style="background:${ri%2===0?'var(--white)':'var(--surface)'}">
              ${secCols.map(c=>{
                const v = r[c];
                const val = v!==null&&v!==undefined ? String(v).trim() : '';
                if (!val) return '<td></td>';
                if (statusCols.includes(c) && WK_STATUS[val]) {
                  return `<td><span class="badge ${WK_STATUS[val]}">${val}</span></td>`;
                }
                return `<td>${val}</td>`;
              }).join('')}
            </tr>`).join('')}
          </tbody>
        </table>
      </div>
    </div>`;
  }).join('') || `<div class="empty-state"><div class="icon">📅</div><p>لا توجد بيانات في ورقة خطة الأسبوع</p></div>`;
}

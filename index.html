<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>عزيز هيلثي</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Cairo',sans-serif;background:#F5F3EE;color:#2C2C2C;min-height:100vh;direction:rtl}
/* NAV — exact from JSX: ink bg, gold border-bottom, gold brand */
nav{background:#5F6F52;height:56px;display:flex;align-items:center;padding:0 2rem;gap:2rem;position:sticky;top:0;z-index:100;border-bottom:3px solid #C5C0A5}
.brand{color:#E8E2D2;font-size:16px;font-weight:700;white-space:nowrap}
.tabs{display:flex;gap:2px;margin-right:auto;flex-wrap:wrap}
.tab{background:none;border:none;border-bottom:2px solid transparent;color:rgba(255,255,255,.7);padding:6px 14px;cursor:pointer;font-family:'Cairo',sans-serif;font-size:12px;font-weight:600;transition:.15s;white-space:nowrap;border-radius:6px 6px 0 0}
.tab:hover{color:rgba(255,255,255,.8)}
.tab.on{background:rgba(255,255,255,.15);border-bottom:3px solid #C5C0A5;color:#E8E2D2}
.sync{display:flex;align-items:center;gap:7px;font-size:11px;color:rgba(255,255,255,.6)}
.dot{width:7px;height:7px;border-radius:50%;background:#4CAF50}
.dot.spin{background:#8A9A72;animation:pulse 1s infinite}
.dot.err{background:#C0392B}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.rbtn{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.2);color:rgba(255,255,255,.7);border-radius:6px;padding:4px 10px;font-family:'Cairo',sans-serif;font-size:11px;cursor:pointer}
.rbtn:hover{background:rgba(255,255,255,.14);color:#fff}
/* PAGES */
.pg{display:none;padding:2rem;max-width:1400px;margin:0 auto}.pg.on{display:block}
/* KPI */
.krow{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:2rem}
@media(max-width:900px){.krow{grid-template-columns:repeat(2,1fr)}}
.kpi{background:#fff;border-radius:12px;padding:1.1rem 1.25rem;border:1px solid #D6D0C0;position:relative;overflow:hidden}
.klbl{font-size:11px;font-weight:600;color:#9A9A80;text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px}
.kval{font-size:26px;font-weight:700;line-height:1;color:#2C2C2C;direction:ltr;text-align:right}
.ksub{font-size:11px;color:#9A9A80;margin-top:5px}
.kacc{position:absolute;top:0;left:0;width:3px;height:100%}
/* CARD */
.card{background:#fff;border-radius:12px;border:1px solid #D6D0C0;overflow:hidden;margin-bottom:1.5rem;padding:1.25rem}
.sh{display:flex;align-items:center;justify-content:space-between;margin-bottom:1.25rem;flex-wrap:wrap;gap:10px}
.sh h2{font-size:15px;font-weight:700;color:#2C2C2C;margin:0}
/* CHART */
.chart-wrap{overflow-x:auto;direction:ltr;margin-top:.75rem}
.chart-wrap svg{display:block;overflow:visible}
/* SELECT */
select.fs{border:1px solid #D6D0C0;border-radius:8px;padding:6px 12px;font-family:'Cairo',sans-serif;font-size:12px;color:#2C2C2C;background:#fff;cursor:pointer;outline:none}
/* GRIDS */
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:1.5rem}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:1.5rem}
@media(max-width:900px){.g3,.g2{grid-template-columns:1fr}}
/* TABLE */
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{background:#F5F3EE;padding:10px 14px;text-align:right;font-weight:600;color:#9A9A80;border-bottom:1px solid #D6D0C0;white-space:nowrap;font-size:11px}
.tbl td{padding:10px 14px;border-bottom:1px solid #D6D0C0;color:#2C2C2C;vertical-align:middle}
.tbl tr:last-child td{border-bottom:none}
.tbl tr:hover td{background:#F5F3EE}
/* BADGES — exact from JSX */
.b{display:inline-flex;align-items:center;padding:2px 8px;border-radius:20px;font-size:10px;font-weight:700;white-space:nowrap}
.bg-gold{background:#E8E2D2;color:#5F6F52}
.bg-green{background:#D5F5E3;color:#5F6F52}
.bg-red{background:#FADBD8;color:#C0392B}
.bg-blue{background:#E8E2D2;color:#5F6F52}
.bg-purple{background:#E8E2D2;color:#5F6F52}
.bg-gray{background:#E8E2D2;color:#9A9A80}
/* PLATFORM TAGS */
.pt{display:inline-flex;padding:1px 7px;border-radius:5px;font-size:9px;font-weight:700}
.pt-tt{background:#1A1A1A;color:#fff}
.pt-sn{background:#FFFC00;color:#1A1A1A}
.pt-ig{background:linear-gradient(45deg,#f09433,#e6683c,#dc2743,#bc1888);color:#fff}
.pt-al{background:#8A9A72;color:#2C2C2C}
/* FILTERS */
.frow{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:1.25rem;align-items:center}
.fb{background:#fff;border:1px solid #D6D0C0;border-radius:20px;padding:5px 14px;font-family:'Cairo',sans-serif;font-size:12px;font-weight:500;cursor:pointer;color:#5F6F52;transition:.15s}
.fb.on{background:#5F6F52;color:#E8E2D2;border-color:#2C2C2C}
.fb:hover:not(.on){background:#F5F3EE}
/* CLIENT CARDS */
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
.cc{background:#fff;border-radius:14px;border:1px solid #D6D0C0;overflow:hidden}
.cc:hover{box-shadow:0 4px 20px rgba(26,26,46,.08)}
.cc.act{border-top:3px solid #8A9A72}
.cc.rep{border-top:3px solid #8A9A72}
/* ad row inside client card — exact from JSX */
.adrow{display:flex;align-items:center;gap:8px;padding:7px 10px;background:#F5F3EE;border-radius:8px;margin-bottom:6px;border:1px solid #D6D0C0}
.adnum{width:20px;height:20px;border-radius:50%;background:#5F6F52;color:#E8E2D2;font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.adinfo{flex:1;min-width:0}
.adtitle{font-size:12px;font-weight:600;color:#2C2C2C;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.adsub{font-size:10px;color:#9A9A80;margin-top:1px;display:flex;gap:5px;align-items:center;flex-wrap:wrap}
.adamt{font-size:12px;font-weight:700;color:#5F6F52;white-space:nowrap}
/* PIPELINE */
.pipe{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}
@media(max-width:1100px){.pipe{grid-template-columns:repeat(2,1fr)}}
@media(max-width:600px){.pipe{grid-template-columns:1fr}}
.pc{background:#fff;border-radius:12px;border:1px solid #D6D0C0;min-height:180px}
.ph{padding:12px 14px;border-bottom-width:2px;border-bottom-style:solid;font-size:12px;font-weight:700;display:flex;justify-content:space-between;align-items:center;color:#2C2C2C}
.pb{padding:10px;display:flex;flex-direction:column;gap:8px}
.pcard{background:#F5F3EE;border:1px solid #D6D0C0;border-radius:10px;padding:10px}
.pdates{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:8px}
.pdb{background:#fff;border:1px solid #D6D0C0;border-radius:8px;padding:6px 8px;text-align:center}
.pdl{font-size:9px;font-weight:700}
.pdv{font-size:11px;font-weight:700;color:#2C2C2C;margin-top:1px}
/* PROGRESS */
.pbar{background:#D6D0C0;border-radius:99px;height:5px;overflow:hidden;margin-top:4px}
.pfill{height:100%;border-radius:99px;background:#8A9A72}
/* LEGEND */
.legrow{display:flex;align-items:center;gap:8px;padding:7px 0;font-size:12px;border-bottom:1px solid #D6D0C0}
.legrow:last-child{border:none}
/* FIN */
.frow2{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid #D6D0C0}
.frow2:last-child{border:none}
/* EXP CARD */
.expc{background:#fff;border:1px solid #D6D0C0;border-radius:10px;padding:12px 14px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center}
/* WEEKLY */
.wks{background:#fff;border-radius:12px;border:1px solid #D6D0C0;overflow:hidden;margin-bottom:1.5rem}
.wkh{padding:12px 16px}
.wkh h3{color:#fff;font-size:14px;font-weight:700;margin:0}
/* CNT */
.cnt{font-size:11px;color:#9A9A80;background:#F5F3EE;padding:2px 8px;border-radius:20px;border:1px solid #D6D0C0;font-weight:600}
/* TOAST */
.toast{position:fixed;bottom:1.5rem;right:1.5rem;background:#5F6F52;color:#E8E2D2;padding:10px 20px;border-radius:10px;font-size:13px;font-weight:700;z-index:999;opacity:0;transform:translateY(8px);transition:.3s;pointer-events:none;border:1px solid #8A9A72}
.toast.show{opacity:1;transform:translateY(0)}
.nd{color:#9A9A80;font-size:13px;padding:16px 0;text-align:center}
</style>
</head>
<body>

<nav>
  <div class="brand">عزيز هيلثي</div>
  <div class="tabs">
    <button class="tab on" onclick="go('overview',this)">نظرة عامة</button>
    <button class="tab" onclick="go('upcoming',this)">الإعلانات القادمة</button>
    <button class="tab" onclick="go('clients',this)">العملاء والإعلانات</button>
    <button class="tab" onclick="go('finance',this)">المالية</button>
    <button class="tab" onclick="go('weekly',this)">قاعدة البيانات الأساسية</button>
  </div>
  <div class="sync">
    <div class="dot spin" id="sdot"></div>
    <span id="stxt">جاري التحميل...</span>
    <button class="rbtn" onclick="refreshAll()">↻</button>
  </div>
</nav>

<!-- OVERVIEW -->
<div class="pg on" id="pg-overview">
  <div class="krow" id="ov-kpis"></div>
  <div class="card">
    <div class="sh">
      <h2>الدخل الشهري</h2>
      <select class="fs" id="ov-yr" onchange="renderOV()"><option value="all">كل السنوات</option></select>
    </div>
    <div class="chart-wrap" id="ov-chart"></div>
  </div>
  <div class="g3">
    <div class="card"><div class="sh"><h2>أنواع الإعلانات</h2></div><div id="ov-types"></div></div>
    <div class="card"><div class="sh"><h2>عقود قيد العمل</h2></div><div id="ov-active"></div></div>
    <div class="card"><div class="sh"><h2>العملاء الدائمون</h2></div><div id="ov-reps"></div></div>
  </div>
  <div class="card"><div class="sh"><h2>العملاء الأعلى دخلاً</h2></div><div id="ov-top"></div></div>
</div>

<!-- UPCOMING -->
<div class="pg" id="pg-upcoming">
  <div class="sh"><h2>الإعلانات القادمة <span class="cnt" id="up-cnt">—</span></h2></div>
  <div class="pipe" id="pipeline"></div>
</div>

<!-- CLIENTS -->
<div class="pg" id="pg-clients">
  <div class="sh"><h2>العملاء والإعلانات <span class="cnt" id="cl-cnt">—</span></h2></div>
  <div class="frow" id="cl-filters">
    <button class="fb on" onclick="flt('all',this)">الكل</button>
    <button class="fb" onclick="flt('active',this)">قيد العمل</button>
    <button class="fb" onclick="flt('repeat',this)">متكرر</button>
    <button class="fb" onclick="flt('contract',this)">عقد</button>
    <button class="fb" onclick="flt('once',this)">مرة واحدة</button>
    <div style="margin-right:auto;display:flex;gap:8px;align-items:center">
      <span style="font-size:12px;color:#9A9A80">ترتيب:</span>
      <select class="fs" id="cl-sort" onchange="renderCL()">
        <option value="all">الكل</option>
        <option value="latest">الأحدث أولاً</option>
        <option value="amount">الأعلى مبلغاً</option>
        <option value="repeat">الأكثر تكراراً</option>
        <option value="s-active">نشط</option>
        <option value="s-ended">منتهي</option>
        <option value="s-paused">متوقف</option>
      </select>
    </div>
  </div>
  <div class="cgrid" id="cl-grid"></div>
</div>

<!-- FINANCE -->
<div class="pg" id="pg-finance">
  <div class="sh"><h2>المالية</h2></div>
  <div class="krow" id="fin-kpis"></div>
  <div class="card">
    <div class="sh">
      <h2>الدخل الشهري</h2>
      <select class="fs" id="fin-yr" onchange="renderFIN()"><option value="all">كل السنوات</option></select>
    </div>
    <div class="chart-wrap" id="fin-chart"></div>
  </div>
  <div class="card"><div class="sh"><h2>المصروفات</h2></div><div id="exp-list"></div></div>
</div>

<!-- WEEKLY / DB -->
<div class="pg" id="pg-weekly">
  <div class="sh"><h2>قاعدة البيانات الأساسية</h2></div>
  <div id="wk-content"><p class="nd">جاري التحميل...</p></div>
</div>

<div class="toast" id="toast"></div>

<script>
const SHEET_ID='1w9BENeOe2dQ-7ZtFMWiXWSI4c7GkM-fNggHNMVmcrvk';
const SN={ads:'الاعلانات',clients:'العملاء',upcoming:'الاعلانات القادمة',finance:'المالية',weekly:'قاعدة البيانات الاساسية'};
const ARM=['يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];
const MEN=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const STAGES=['غير معتمد','معتمد','التصوير','المونتاج','النشر'];
const SCOL={'غير معتمد':'#C0392B','معتمد':'#5F6F52','التصوير':'#8A9A72','المونتاج':'#C5C0A5','النشر':'#5F6F52'};
const WKS={
  pub:{ar:'خطة النشر',bg:'#5F6F52',cols:['المنصة','عدد المنشورات','عنوان المحتوى','تاريخ النشر','المسؤول','الحالة','ملاحظات']},
  ideas:{ar:'أفكار المحتوى',bg:'#8A9A72',cols:['عنوان الفكرة','الهوك','التفاصيل','المسؤول','الحالة','ملاحظات']},
  wkads:{ar:'الإعلانات',bg:'#2C2C2C',cols:['البراند','حالة البريف','حالة السكريبت','نوع التصوير','تاريخ التصوير','تاريخ النشر','المسؤول','الحالة العامة','ملاحظات']},
  tasks:{ar:'مهام الفريق',bg:'#C5C0A5',cols:['المهمة','المسؤول','الموعد النهائي','الحالة','مرتبطة بـ','ملاحظات']},
};

let rawAds=[],cmap={},rawUp=[],rawExp=[],wkRows=[],wkCols=[];
let curFlt='all';

function pgd(v){const d=new Date(String(v).includes('Date(')?v.slice(5,-1).split(',').map(Number).map((n,i)=>i?n:n):[v].map(x=>{if(typeof x==='string'&&x.match(/^\d{4}-\d{2}-\d{2}$/))return new Date(x+'T00:00:00');const d=new Date(x);return isNaN(d)?null:d;})[0]);return d instanceof Date&&!isNaN(d)?d:null;}
function pgDate(v){if(!v)return null;if(typeof v==='string'&&v.startsWith('Date(')){const p=v.slice(5,-1).split(',').map(Number);return new Date(p[0],p[1],p[2]);}if(typeof v==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(v))return new Date(v+'T00:00:00');if(v instanceof Date)return v;const d=new Date(v);return isNaN(d.getTime())?null:d;}
function fd(v){const d=pgDate(v);if(!d)return'—';return d.getDate()+' '+ARM[d.getMonth()]+' '+d.getFullYear();}
function fm(n){return n?Number(n).toLocaleString('en-US')+' ر.س':'—';}
function pn(v){if(v===null||v===undefined||v==='')return 0;if(typeof v==='number')return isNaN(v)?0:v;const n=parseFloat(String(v).replace(/[^\d.-]/g,''));return isNaN(n)?0:n;}
function pp(v){if(!v&&v!==0)return 0;if(typeof v==='number')return v>0&&v<=1?Math.round(v*100):Math.round(v);const n=parseFloat(String(v).replace(/[^0-9.-]/g,''));if(isNaN(n))return 0;return n>0&&n<=1?Math.round(n*100):Math.round(n);}

function ptag(p){if(!p)return'';const m={'تيك توك':'pt-tt','سناب':'pt-sn','انستقرام':'pt-ig','جميع المنصات':'pt-al'};return'<span class="pt '+(m[p]||'pt-al')+'">'+p+'</span>';}
function sbadge(s){if(!s)return'';const m={'تم':'bg-green','تمت':'bg-green','قيد العمل':'bg-gold','ملغي':'bg-red','نشط':'bg-blue','منتهي':'bg-gray','متوقف':'bg-gray','لم يبدأ':'bg-gray','قيد التنفيذ':'bg-blue','مكتمل':'bg-green','مؤجل':'bg-gold'};return'<span class="b '+(m[s]||'bg-gray')+'">'+s+'</span>';}

function go(id,btn){document.querySelectorAll('.pg').forEach(p=>p.classList.remove('on'));document.querySelectorAll('.tab').forEach(t=>t.classList.remove('on'));document.getElementById('pg-'+id).classList.add('on');btn.classList.add('on');}
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2500);}
function sync(s){const d=document.getElementById('sdot'),t=document.getElementById('stxt');d.className='dot'+(s==='spin'?' spin':s==='err'?' err':'');t.textContent=s==='spin'?'جاري التحميل...':s==='err'?'خطأ في الاتصال':'آخر تحديث: '+new Date().toLocaleTimeString('ar-SA',{hour:'2-digit',minute:'2-digit'});}

// ── FETCH ──
async function fetchSheet(name){
  const url='https://docs.google.com/spreadsheets/d/'+SHEET_ID+'/gviz/tq?tqx=out:json&headers=0&sheet='+encodeURIComponent(name)+'&t='+Date.now();
  const r=await fetch(url,{cache:'no-store'});if(!r.ok)throw new Error('HTTP '+r.status);
  const txt=await r.text();
  const m=txt.match(/google\.visualization\.Query\.setResponse\(([\s\S]*)\)/);if(!m)throw new Error('Bad gviz');
  const json=JSON.parse(m[1]);if(!json.table)throw new Error('No table');
  const rows=json.table.rows||[];
  let hi=-1,cols=[];
  for(let i=0;i<Math.min(10,rows.length);i++){
    const v=(rows[i].c||[]).map(c=>c?String(c.f??c.v??'').trim():'');
    if(v.filter(x=>x&&isNaN(parseFloat(x))&&!x.startsWith('Date(')).length>=2){cols=v;hi=i;break;}
  }
  if(hi===-1)return{cols:[],rows:[]};
  const data=rows.slice(hi+1).map(row=>{
    const c=row.c||[];const o={};
    cols.forEach((col,i)=>{if(!col)return;const cell=c[i];if(!cell){o[col]=null;o['_n_'+col]=null;return;}o[col]=cell.f!=null?String(cell.f).trim():(cell.v!=null?cell.v:null);o['_n_'+col]=typeof cell.v==='number'?cell.v:null;});
    return o;
  }).filter(r=>Object.values(r).some(v=>v!=null&&v!==''&&v!==undefined));
  return{cols,rows:data};
}
async function sl(k){try{return await fetchSheet(SN[k]);}catch(e){console.warn('['+k+']',e.message);return null;}}

// ── LOAD ──
async function loadAll(){
  sync('spin');
  const[aD,cD,uD,fD,wD]=await Promise.all([sl('ads'),sl('clients'),sl('upcoming'),sl('finance'),sl('weekly')]);
  if(!aD&&!cD&&!uD&&!fD&&!wD){sync('err');document.getElementById('ov-kpis').innerHTML='<div style="grid-column:1/-1;background:#fff;border:1px solid #FADBD8;border-radius:12px;padding:2rem;text-align:center"><h3 style="color:#C0392B;margin-bottom:8px">تعذر الاتصال بـ Google Sheets</h3><p style="color:#9A9A80;font-size:13px">تأكد من إعدادات المشاركة</p><button onclick="refreshAll()" style="margin-top:12px;background:#5F6F52;color:#E8E2D2;border:none;padding:8px 20px;border-radius:8px;font-family:Cairo,sans-serif;font-size:13px;font-weight:700;cursor:pointer">إعادة المحاولة</button></div>';return;}
  // ADS
  rawAds=[];
  if(aD&&aD.rows.length){
    const bc=aD.cols.find(c=>c&&(c.includes('البراند')||c.includes('الشركة')||c.includes('العميل')))||'';
    const ac=aD.cols.find(c=>c&&(c.includes('المبلغ')||c.includes('القيمة')))||'';
    const pc=aD.cols.find(c=>c&&c.includes('النسبة'))||'';
    const tc=aD.cols.find(c=>c&&(c.includes('نوع')||c.includes('النوع')))||'';
    const sc=aD.cols.find(c=>c&&(c.includes('المرحلة')||(c.includes('الحالة')&&!c.includes('حالة'))))||'';
    const plc=aD.cols.find(c=>c&&c.includes('المنصة'))||'';
    const cc=aD.cols.find(c=>c&&c.includes('المدينة'))||'';
    const adc=aD.cols.find(c=>c&&c.includes('تاريخ الإعلان'))||'';
    const pdc=aD.cols.find(c=>c&&c.includes('تاريخ النشر'))||'';
    const nc=aD.cols.find(c=>c&&c.includes('ملاحظات'))||'';
    const ic=aD.cols.find(c=>c&&c.toUpperCase()==='ID')||'';
    aD.rows.forEach(r=>{

// ── CHART — exact SVG from JSX ──
function buildChart(elId,yf){
  const bm={};
  rawAds.forEach(a=>{
    if(!a.adDate&&!a.pubDate)return;
    const d=pgDate(a.adDate||a.pubDate);if(!d)return;
    if(yf!=='all'&&d.getFullYear()!==+yf)return;
    const k=MEN[d.getMonth()]+' '+d.getFullYear();
    bm[k]=(bm[k]||0)+a.amount;
  });
  const keys=Object.keys(bm);
  if(!keys.length){document.getElementById(elId).innerHTML='<div style="color:#9A9A80;font-size:12px;padding:20px 0">لا توجد بيانات</div>';return;}
  let allM;
  if(yf==='all'){
    const dates=keys.map(k=>{const[mo,yr]=k.split(' ');return new Date(yr,MEN.indexOf(mo),1);}).sort((a,b)=>a-b);
    allM=[];let cur=new Date(dates[0]);const end=dates[dates.length-1];
    while(cur<=end){allM.push(MEN[cur.getMonth()]+' '+cur.getFullYear());cur.setMonth(cur.getMonth()+1);}
  } else {
    allM=MEN.map(mo=>mo+' '+yf);
  }
  const vals=allM.map(m=>bm[m]||0);
  const mx=Math.max(...vals,1);
  const W=Math.max(600,allM.length*70),H=170,pL=40,pR=20,pT=20,pB=28;
  const plotW=W-pL-pR,plotH=H-pT-pB;
  const stepX=allM.length>1?plotW/(allM.length-1):0;
  const pts=vals.map((v,i)=>({x:pL+i*stepX,y:pT+plotH-(v/mx)*plotH,v,m:allM[i]}));
  const pd=pts.map((p,i)=>(i===0?'M':'L')+p.x.toFixed(1)+','+p.y.toFixed(1)).join(' ');
  const ad=pd+' L'+pts[pts.length-1].x.toFixed(1)+','+(pT+plotH)+' L'+pts[0].x.toFixed(1)+','+(pT+plotH)+' Z';
  const grid=[0,.25,.5,.75,1].map(f=>{const y=pT+plotH*(1-f);return'<line x1="'+pL+'" y1="'+y.toFixed(1)+'" x2="'+(W-pR)+'" y2="'+y.toFixed(1)+'" stroke="#D6D0C0" stroke-width="1"/>';}).join('');
  const dots=pts.map((p,i)=>{
    const prev=i>0?pts[i-1].v:null;let trend='';
    if(prev!=null&&p.v>0){const diff=p.v-prev;const pct=prev>0?Math.round(Math.abs(diff)/prev*100):0;if(diff>0)trend='<text x="'+p.x.toFixed(1)+'" y="'+(p.y-22).toFixed(1)+'" text-anchor="middle" style="font-size:9px;font-weight:700;fill:#5F6F52">↑'+pct+'%</text>';else if(diff<0)trend='<text x="'+p.x.toFixed(1)+'" y="'+(p.y-22).toFixed(1)+'" text-anchor="middle" style="font-size:9px;font-weight:700;fill:#C0392B">↓'+pct+'%</text>';}
    return'<g>'+
      '<circle cx="'+p.x.toFixed(1)+'" cy="'+p.y.toFixed(1)+'" r="4" fill="#fff" stroke="#5F6F52" stroke-width="2.5"/>'+
      (p.v>0?'<text x="'+p.x.toFixed(1)+'" y="'+(p.y-10).toFixed(1)+'" text-anchor="middle" style="font-size:10px;font-weight:700;fill:#2C2C2C">'+(p.v/1000).toFixed(1)+'k</text>':'')+
      trend+
      '<text x="'+p.x.toFixed(1)+'" y="'+(H-8)+'" text-anchor="middle" style="font-size:10px;fill:#9A9A80;font-weight:600">'+p.m.split(' ')[0]+'</text>'+
      '</g>';
  }).join('');
  document.getElementById(elId).innerHTML='<svg viewBox="0 0 '+W+' '+H+'" style="min-width:'+W+'px;width:100%;display:block;overflow:visible">'+
    grid+'<path d="'+ad+'" fill="#5F6F52" opacity="0.1"/><path d="'+pd+'" fill="none" stroke="#5F6F52" stroke-width="2.5" stroke-linejoin="round"/>'+dots+'</svg>';
}

function renderCL(){

  else if(curFlt==='contract')list=list.filter(c=>c.ads.some(a=>a.type&&a.type.includes('عقد')));
  else if(curFlt==='once')list=list.filter(c=>c.ads.some(a=>a.type==='مرة واحدة'));
  list=[...list];
  const tot=c=>c.ads.reduce((s,a)=>s+a.amount,0);
  const srt=document.getElementById('cl-sort').value;
  if(srt==='all'||srt==='amount')list.sort((a,b)=>tot(b)-tot(a));
  else if(srt==='latest')list.sort((a,b)=>{const la=a.ads.map(x=>x.adDate||'').filter(Boolean).sort().reverse()[0]||'';const lb=b.ads.map(x=>x.adDate||'').filter(Boolean).sort().reverse()[0]||'';return String(lb).localeCompare(String(la));});
  else if(srt==='repeat')list.sort((a,b)=>b.ads.length-a.ads.length);
  else if(srt==='s-active'){list=list.filter(c=>c.status==='نشط');list.sort((a,b)=>tot(b)-tot(a));}
  else if(srt==='s-ended'){list=list.filter(c=>c.status==='منتهي');list.sort((a,b)=>tot(b)-tot(a));}

    const vals=wkCols.map(c=>row[c]).filter(v=>v!=null&&v!==undefined&&String(v).trim()!=='');
    if(!vals.length)return;
    const first=String(wkCols.map(c=>row[c]).find(v=>v!=null&&v!==undefined&&String(v).trim()!=='')||'').trim();
    const others=wkCols.slice(1).map(c=>row[c]).filter(v=>v!=null&&v!==undefined&&String(v).trim()!=='');
    const sk=Object.keys(WKS).find(k=>WKS[k].ar===first);
    if(sk&&others.length===0){cur=sk;return;}
    if(!cur)return;
    const ec=WKS[cur].cols;
    if(ec.filter(ec=>vals.map(v=>String(v)).includes(ec)).length>=2)return;
    const obj={};let ci=0;
    wkCols.forEach(col=>{const v=row[col];if(ci<ec.length)obj[ec[ci]]=v!=null&&v!==undefined?String(v).trim():'';ci++;});
    if(Object.values(obj).some(v=>v))res[cur].push(obj);
  });
  const hasAny=Object.values(res).some(a=>a.length>0);
  if(!hasAny){el.innerHTML='<p class="nd">لا توجد بيانات منظمة في ورقة خطة الأسبوع</p>';return;}
  const SC=new Set(['الحالة','حالة البريف','حالة السكريبت','الحالة العامة']);
  el.innerHTML=Object.keys(WKS).map(key=>{
    const rows=res[key]||[];const def=WKS[key];
    return'<div class="wks"><div class="wkh" style="background:'+def.bg+'"><h3>'+def.ar+'</h3></div>'+
      '<div style="overflow-x:auto"><table class="tbl"><thead><tr>'+def.cols.map(c=>'<th>'+c+'</th>').join('')+'</tr></thead>'+
      '<tbody>'+(rows.length?rows.map((r,ri)=>'<tr style="background:'+(ri%2===0?'#fff':'#F7F6F2')+'">'+def.cols.map(col=>{const v=r[col]||'';if(!v)return'<td></td>';if(SC.has(col))return'<td>'+sbadge(v)+'</td>';return'<td>'+v+'</td>';}).join('')+'</tr>').join(''):'<tr><td colspan="'+def.cols.length+'" class="nd">لا توجد بيانات</td></tr>')+
      '</tbody></table></div></div>';
  }).join('');
}

loadAll();
setInterval(()=>loadAll(),5*60*1000);
</script>
